<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}[hidden]{display:none!important}</style>
<title>Erasmus Sınav Provası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column like an exam booklet; answer-sheet bubbles (optik form) as the recurring motif */
:root{
  --paper:#f6f7fb; --sheet:#ffffff; --ink:#18223d; --muted:#5b6582; --line:#dde1ec;
  --form:#c4314b; --form-soft:#fbe9ec; --mark:#1f4fd1; --mark-soft:#e6ecfc;
  --ok:#17803d; --ok-soft:#e3f4e8; --bad:#c4314b; --bad-soft:#fbe9ec; --warn:#b26a00;
  --f-ui:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-en:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1424; --sheet:#171e33; --ink:#e7eaf4; --muted:#9aa3bf; --line:#2a3350;
  --form:#f07087; --form-soft:#3a1c27; --mark:#7d9dff; --mark-soft:#1d2a52;
  --ok:#4cc477; --ok-soft:#163222; --bad:#f07087; --bad-soft:#3a1c27; --warn:#f0b04a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1424; --sheet:#171e33; --ink:#e7eaf4; --muted:#9aa3bf; --line:#2a3350;
  --form:#f07087; --form-soft:#3a1c27; --mark:#7d9dff; --mark-soft:#1d2a52;
  --ok:#4cc477; --ok-soft:#163222; --bad:#f07087; --bad-soft:#3a1c27; --warn:#f0b04a; color-scheme:dark}
/* Backgrounds the viewer can choose (html:root[...] beats the light/dark rules above) */
html:root[data-bg="light"]{--paper:#f6f7fb;--sheet:#ffffff;--ink:#18223d;--muted:#5b6582;--line:#dde1ec;--form:#c4314b;--form-soft:#fbe9ec;--mark:#1f4fd1;--mark-soft:#e6ecfc;--ok:#17803d;--ok-soft:#e3f4e8;--bad:#c4314b;--bad-soft:#fbe9ec;--warn:#b26a00;color-scheme:light}
html:root[data-bg="dark"]{--paper:#0f1424;--sheet:#171e33;--ink:#e7eaf4;--muted:#9aa3bf;--line:#2a3350;--form:#f07087;--form-soft:#3a1c27;--mark:#7d9dff;--mark-soft:#1d2a52;--ok:#4cc477;--ok-soft:#163222;--bad:#f07087;--bad-soft:#3a1c27;--warn:#f0b04a;color-scheme:dark}
html:root[data-bg="ocean"]{--paper:#0b1d2a;--sheet:#12293a;--ink:#e4f1f7;--muted:#8fb0c2;--line:#21425a;--form:#ff8a65;--form-soft:#3a2620;--mark:#4fc3f7;--mark-soft:#123a50;--ok:#5bd38a;--ok-soft:#133a26;--bad:#ff8a80;--bad-soft:#3d1f22;--warn:#ffcc66;color-scheme:dark}
html:root[data-bg="forest"]{--paper:#eef5ee;--sheet:#ffffff;--ink:#1b2e22;--muted:#557060;--line:#d3e3d6;--form:#b23a48;--form-soft:#f8e5e8;--mark:#2e7d4f;--mark-soft:#e0f0e5;--ok:#2e7d4f;--ok-soft:#e0f0e5;--bad:#b23a48;--bad-soft:#f8e5e8;--warn:#a86b00;color-scheme:light}
html:root[data-bg="sand"]{--paper:#f5efe4;--sheet:#fffaf2;--ink:#2e2418;--muted:#7a6a55;--line:#e6dccb;--form:#b5452e;--form-soft:#f7e3dc;--mark:#8a5a12;--mark-soft:#f3e6cf;--ok:#3d7a3a;--ok-soft:#e3efdc;--bad:#b5452e;--bad-soft:#f7e3dc;--warn:#a86b00;color-scheme:light}
html:root[data-bg="night"]{--paper:#17122b;--sheet:#221a3d;--ink:#ece8fb;--muted:#a69cc8;--line:#352b5c;--form:#ff7aa2;--form-soft:#3b1f33;--mark:#a78bfa;--mark-soft:#2e2457;--ok:#5fd39a;--ok-soft:#173527;--bad:#ff7a8a;--bad-soft:#3d1d27;--warn:#f5c060;color-scheme:dark}
html:root[data-bg="rose"]{--paper:#fbf0f3;--sheet:#ffffff;--ink:#3a1e2a;--muted:#84606f;--line:#efd6de;--form:#c2185b;--form-soft:#fbe1ea;--mark:#7b3fa0;--mark-soft:#f1e3f8;--ok:#2e7d4f;--ok-soft:#e0f0e5;--bad:#c2185b;--bad-soft:#fbe1ea;--warn:#a86b00;color-scheme:light}
*{box-sizing:border-box}
/* Background picker swatches (each shows the theme it applies) */
.bgp{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.sw.on{outline:3px solid var(--mark);outline-offset:2px}
.sw-auto{background:linear-gradient(135deg,#f6f7fb 50%,#0f1424 50%)}
.sw-light{background:linear-gradient(135deg,#ffffff 50%,#1f4fd1 50%)}
.sw-dark{background:linear-gradient(135deg,#171e33 50%,#7d9dff 50%)}
.sw-ocean{background:linear-gradient(135deg,#12293a 50%,#4fc3f7 50%)}
.sw-forest{background:linear-gradient(135deg,#eef5ee 50%,#2e7d4f 50%)}
.sw-sand{background:linear-gradient(135deg,#fffaf2 50%,#8a5a12 50%)}
.sw-night{background:linear-gradient(135deg,#221a3d 50%,#a78bfa 50%)}
.sw-rose{background:linear-gradient(135deg,#fbf0f3 50%,#c2185b 50%)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
#app{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.en{font-family:var(--f-en);direction:ltr;text-align:left}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}

/* Home */
.hero{display:grid;gap:10px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.hero .kicker{color:var(--form);font-weight:700;font-size:13px;letter-spacing:.04em}
.hero h1{font-size:28px}
.hero p{margin:0;color:var(--muted)}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.count b{font-family:var(--f-num);font-size:22px;color:var(--form)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:18px 0;border:1px solid var(--line);border-radius:10px;background:var(--sheet);overflow:hidden}
.facts div{padding:12px 8px;text-align:center;border-inline-start:1px solid var(--line)}
.facts div:first-child{border-inline-start:0}
.facts b{display:block;font-family:var(--f-num);font-size:20px}
.facts span{font-size:12px;color:var(--muted)}
@media (max-width:420px){.facts{grid-template-columns:repeat(2,1fr)}.facts div:nth-child(3){border-inline-start:0}.facts div:nth-child(n+3){border-top:1px solid var(--line)}}
section{margin-top:26px}
section>h2{font-size:18px;margin-bottom:10px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);text-align:start}
.btn:hover{border-color:var(--mark)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn small{display:block;color:var(--muted);font-size:13px}
.btn.primary small{color:inherit;opacity:.75}
.stack{display:grid;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.secrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.secrow:last-child{border-bottom:0}
.tag{font-family:var(--f-num);font-size:12px;padding:2px 8px;border-radius:99px;background:var(--mark-soft);color:var(--mark)}
.hist{display:grid;gap:6px}
.hist div{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;font-size:14px}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}
.tips{margin:0;padding-inline-start:20px;color:var(--muted)}
.tips li{margin:4px 0}
.resume{border:2px solid var(--form);background:var(--form-soft)}

/* Quiz */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.bar .t{font-family:var(--f-num);font-size:18px;padding:2px 10px;border-radius:6px;background:var(--mark-soft);color:var(--mark)}
.bar .t.low{background:var(--form-soft);color:var(--form)}
.bar .grow{flex:1;min-width:0}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--mark)}
.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:14px}
.secname{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.passage{margin-top:12px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-height:45vh;overflow:auto;font-size:16px;line-height:1.7}
.passage h3{font-family:var(--f-en);font-size:17px;margin-bottom:6px}
.passage p{margin:0 0 10px}
.qcard{margin-top:14px}
.qnum{font-family:var(--f-num);color:var(--form);font-size:14px}
.qtext{font-size:19px;line-height:1.55;margin:4px 0 14px;white-space:pre-line}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);font-family:var(--f-en);font-size:17px;direction:ltr;text-align:left}
.opt .bub{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--form);color:var(--form);display:grid;place-items:center;font-family:var(--f-num);font-size:14px}
.opt:hover{border-color:var(--mark)}
.opt.sel{border-color:var(--mark);background:var(--mark-soft)}
.opt.sel .bub{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt[disabled]{cursor:default}
.explain{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--sheet);border:1px solid var(--line);border-inline-start:4px solid var(--ok)}
.explain.no{border-inline-start-color:var(--bad)}
.nav{position:fixed;inset:auto 0 0 0;z-index:5;background:var(--sheet);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav .in{max-width:680px;margin:0 auto;display:flex;gap:8px}
.nav button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);font-weight:500}
.nav .go{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.flag.on{background:var(--form-soft);border-color:var(--form);color:var(--form)}

/* answer sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,28,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .pan{background:var(--sheet);width:100%;max-width:680px;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
.omap{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px;margin:12px 0}
.omap button{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px solid var(--form);background:transparent;color:var(--form);font-family:var(--f-num);font-size:13px;position:relative}
.omap button.a{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.omap button.cur{outline:3px solid var(--ink);outline-offset:2px}
.omap button.f::after{content:"";position:absolute;top:-3px;inset-inline-end:-3px;width:10px;height:10px;border-radius:50%;background:var(--warn)}
.omap-sec{font-size:13px;color:var(--muted);margin-top:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dlg .pan{border-radius:16px;margin:auto 16px;max-width:420px}
.dlg{align-items:center}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--sheet)}
.row .go{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* Result */
.score{display:grid;justify-items:center;gap:4px;padding:24px 0 18px;border-bottom:2px solid var(--ink);text-align:center}
.score .big{font-family:var(--f-num);font-size:64px;line-height:1}
.score .big small{font-size:22px;color:var(--muted)}
.verdict{padding:4px 14px;border-radius:99px;font-weight:700}
.verdict.pass{background:var(--ok-soft)}.verdict.fail{background:var(--bad-soft)}
.sbar{display:grid;grid-template-columns:7.5em 1fr 3.5em;gap:10px;align-items:center;padding:8px 0}
.sbar .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.sbar .tr i{display:block;height:100%;background:var(--mark)}
.rv{padding:14px 0;border-bottom:1px solid var(--line)}
.rv .qtext{font-size:17px;margin:4px 0 8px}
.rv .a{font-family:var(--f-en);direction:ltr;text-align:left;font-size:15px}
.rv .a.y{color:var(--bad)}.rv .a.c{color:var(--ok)}
.rv .ex{font-size:14px;color:var(--muted);margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--sheet);font-size:14px}
.chips button.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
/* Update banner */
.upd{position:fixed;z-index:30;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));max-width:656px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--ink);color:var(--sheet);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.upd span{flex:1;min-width:0}
.upd .go{border:0;border-radius:8px;padding:8px 12px;background:var(--sheet);color:var(--ink);font-weight:700}
.upd .x{border:0;background:transparent;color:inherit;padding:6px}
.explain,.rv .ex{white-space:pre-line}
/* Speaker, star, settings, TOEFL/IELTS */
.spk{display:inline-grid;place-items:center;width:34px;height:34px;padding:0;margin-inline-start:6px;border-radius:50%;border:1px solid var(--line);background:var(--mark-soft);color:var(--mark);vertical-align:middle;cursor:pointer}
.spk svg{width:18px;height:18px;fill:currentColor;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.spk.sm{width:28px;height:28px;margin:0}
.spk.sm svg{width:15px;height:15px}
.qtools{display:flex;align-items:center;gap:8px}
.star{border:1px solid var(--line);background:var(--sheet);color:var(--warn);border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1;padding:0}
.star.on{background:var(--warn);color:var(--sheet);border-color:var(--warn)}
.audio{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);display:grid;gap:8px}
.audrow,.wtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.audrow button,.wtools button{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);font-weight:600}
.audrow .go,.wtools .go,.srow .go{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.wtools .t{font-family:var(--f-num);font-size:18px;padding:4px 10px;border-radius:6px;background:var(--mark-soft);color:var(--mark)}
.wtools .t.low{background:var(--form-soft);color:var(--form)}
.note{padding:10px 14px;border-radius:10px;background:var(--mark-soft);border:1px solid var(--line);font-size:14px}
.note.ok{background:var(--ok-soft);border-color:var(--ok)}.note.bad{background:var(--bad-soft);border-color:var(--bad)}
.codebox,.wbox{width:100%;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink);font-family:var(--f-num);font-size:13px}
.wbox{font-family:var(--f-en);font-size:16px;line-height:1.6;min-height:220px}
.remrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.remrow input[type=time]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);font:inherit}
.switch{display:flex;gap:8px;align-items:center}
.fctop{display:flex;justify-content:space-between;align-items:center}
.srow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.srow button{padding:10px 14px;border-radius:10px;border:1px solid var(--ink);font-weight:600}
.sphase{margin:10px 0;padding:18px;border-radius:12px;border:2px dashed var(--line);display:flex;justify-content:space-between;align-items:center;font-size:20px;min-height:64px}
.sphase.prep{border-color:var(--warn)}.sphase.speak{border-color:var(--ok);background:var(--ok-soft)}.sphase.done{border-color:var(--mark)}
.sphase .num{font-size:28px}
.tbtn{border-color:var(--mark)}
/* Today card, flashcards, charts */
.today{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--sheet);display:grid;gap:14px}
.todayrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.streak{display:flex;align-items:baseline;gap:8px}
.streak b{font-size:34px;line-height:1;color:var(--form)}
.goal{flex:1;min-width:180px}
.btn[disabled]{opacity:.55;cursor:default}
.fwrap{display:grid;gap:12px;margin-top:14px}
.fcard{display:grid;place-items:center;gap:10px;min-height:220px;padding:24px;border:2px solid var(--line);border-radius:16px;background:var(--sheet);color:var(--ink);text-align:center;width:100%}
.fcard.done{min-height:0;place-items:stretch}
.fword{font-family:var(--f-en);font-size:30px;font-weight:600}
.fmean{font-size:20px;font-weight:700;color:var(--mark)}
.chart{width:100%;height:auto;display:block;background:var(--sheet);border:1px solid var(--line);border-radius:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .passln{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:5 4}
.chart .ax{fill:var(--muted);font-size:12px;font-family:var(--f-num)}
.chart .ln{fill:none;stroke:var(--mark);stroke-width:3;stroke-linejoin:round}
.chart .dotp{fill:var(--ok)}.chart .dotf{fill:var(--bad)}
.chart .lastv{fill:var(--ink);font-size:14px;font-weight:700;font-family:var(--f-num)}
.chart .dbar{fill:var(--mark-soft);stroke:var(--mark)}.chart .dbarok{fill:var(--ok)}
/* B2 level */
.lvl{display:inline-block;font-family:var(--f-num);font-size:12px;line-height:1.5;padding:1px 8px;border-radius:99px;background:var(--form);color:var(--sheet);vertical-align:middle}
.b2sec{border:2px solid var(--form);border-radius:14px;padding:16px;background:var(--form-soft)}
.b2note{margin:0 0 12px;font-size:14px}
.btn.b2btn{border-color:var(--form)}
.b2tag{display:inline-block;margin-top:12px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--form-soft);color:var(--form);border:1px solid var(--form)}
/* Vocabulary list */
.search{width:100%;padding:12px 14px;margin:14px 0 4px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink);font:inherit}
.search:focus-visible{outline:3px solid var(--mark);outline-offset:1px}
.vrow{display:grid;grid-template-columns:minmax(7em,38%) 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.vrow b{font-family:var(--f-en);font-weight:600;min-width:0;overflow-wrap:anywhere}
.vrow span{min-width:0}
/* Lessons */
.lesson{background:var(--sheet);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.lesson summary{padding:14px 16px;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;list-style:none}
.lesson summary::-webkit-details-marker{display:none}
.lesson[open] summary{border-bottom:1px solid var(--line)}
.lb{padding:4px 16px 16px;min-width:0}
.lb p{margin:10px 0}
.lb ul{padding-inline-start:20px;margin:10px 0}
.lb li{margin:4px 0}
.tw{overflow-x:auto;margin:10px 0}
.lb table{width:100%;border-collapse:collapse;font-size:14px}
.lb th{background:var(--mark-soft);color:var(--mark);font-weight:700}
.lb th,.lb td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:start;vertical-align:top}
.eg{font-family:var(--f-en);text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:10px 0;line-height:1.7}
.e{font-family:var(--f-en)}
@media (prefers-reduced-motion:no-preference){.opt,.btn{transition:border-color .15s,background .15s}}
</style>

{t:"A Semester in Porto",x:["When I first arrived in Porto for my Erasmus semester, I could hardly say \"thank you\" in Portuguese. I had studied English for years, so I thought communication would be easy. However, I soon realised that many older people in the city did not speak English, and I had to rely on gestures and a translation app. During the first month, I felt homesick and spent most evenings in my room calling my family.","Things changed when my flatmate, a Spanish student called Lucía, invited me to a weekly language exchange at a café near the university. There, local students practised English while visitors like us learned Portuguese. Within a few weeks, I could order food, ask for directions and even make small jokes.","My courses were also different from those at home. Instead of final exams, most lecturers gave us group projects, which forced me to work with people from five different countries. It was sometimes frustrating, but it taught me patience and how to manage disagreements. Looking back, the most valuable thing I gained was not a certificate but confidence. I now believe I can adapt to almost any situation."],

{t:"Sleep Before Exams",x:["Many university students believe that staying up late to study is the best way to prepare for exams. However, research suggests the opposite. Scientists have found that sleep plays a key role in memory. While we sleep, the brain organises the information we learned during the day and stores it in long-term memory. In one study, students who slept eight hours after learning a list of words remembered 20 percent more of them the next day than students who stayed awake all night.","Lack of sleep also affects concentration and mood. Tired students find it harder to focus in class, and they are more likely to feel stressed or anxious. In addition, many of them try to stay awake by drinking large amounts of coffee or energy drinks, which can make it even more difficult to fall asleep later.","Experts recommend that young adults get between seven and nine hours of sleep each night. They also advise avoiding screens for at least thirty minutes before bed, because the blue light from phones can delay sleep. So the next time you have an important exam, remember that a good night's sleep may be more useful than a few extra hours with your notes."],

{t:"Green Campus Volunteer Programme",x:["Are you interested in protecting the environment and meeting new people? The Student Union is looking for volunteers to join the Green Campus Programme this spring. Volunteers will help with recycling campaigns, plant trees around the campus and organise a \"No Plastic Week\" in April.","No previous experience is necessary, but applicants must be registered students and able to give at least four hours per week. All volunteers will receive free training in the first week of March, as well as a certificate at the end of the programme, which can be added to your CV. Those who complete more than 40 hours will also be given priority when applying for international summer camps.","To apply, fill in the online form on the Student Union website before 20 February. Places are limited to 30 students, so early applications are recommended. For more information, visit the Student Union office in Building B, open on weekdays from 9 am to 4 pm. Please note that the office is closed on public holidays."],

{t:"The Story of the Bicycle",x:["Today, bicycles are one of the most popular forms of transport in the world, but their history is relatively short. The first machine similar to a bicycle was invented in Germany in 1817 by Karl Drais. It had two wheels but no pedals, so riders had to push it along the ground with their feet.","In the 1860s, French inventors added pedals to the front wheel, making it possible to travel faster. Later, a design with a huge front wheel and a tiny back wheel became fashionable. Although it was fast, it was also dangerous, as riders often fell from a great height.","The real breakthrough came in the 1880s with the \"safety bicycle\", which had two wheels of equal size and a chain connected to the back wheel. This design is very similar to the bicycles we ride today. Bicycles quickly became popular because they were cheaper than horses and gave ordinary people, especially women, more freedom to travel. Nowadays, many cities are building bike lanes to reduce traffic and air pollution."],

{t:"Learning Languages Through Films",x:["Many people say that watching films in a foreign language is one of the most enjoyable ways to improve language skills. But is it really effective? According to language teachers, the answer is yes, as long as it is done in the right way.","Firstly, beginners should not expect to understand everything. At lower levels, it is better to watch films with subtitles in their own language, so they can follow the story while getting used to the sound of the new language. As their level improves, learners can switch to subtitles in the foreign language, and finally try watching without any subtitles at all.","Secondly, choosing the right film is important. Comedies and dramas about everyday life are usually more useful than science fiction or historical films, because they contain the kind of language people actually use. Short TV series are also a good choice, as viewers get used to the characters' voices and accents.","Finally, experts suggest being an active viewer. Instead of simply relaxing on the sofa, learners should pause the film, write down useful expressions and repeat sentences aloud. This takes more time, but it helps new words move from short-term to long-term memory."],

{t:"Summer Swimming Courses",x:["RIVERSIDE SPORTS CENTRE. Whether you are a complete beginner or want to improve your technique, our summer swimming courses are for you! Courses start on 1 July and last for six weeks. Classes are held twice a week, on Tuesday and Thursday evenings, and each lesson lasts 45 minutes.","Groups are small, with a maximum of eight people, so every swimmer gets plenty of attention from our qualified instructors. Children under 12 must be accompanied by an adult.","The full course costs 1,200 lira. University students and people over 65 can get a 20% discount by showing a valid ID card. Swimming caps are compulsory and can be bought at reception for 50 lira.","To register, visit reception. Please note that payment must be made in full before the first lesson. Unfortunately, we cannot offer refunds after the course has started."],

{t:"Why Bees Matter",x:["Bees are small, but they play an enormous role in our lives. When bees move from flower to flower to collect nectar, they carry pollen with them. This process, called pollination, allows plants to produce fruits and seeds. In fact, about one-third of the food we eat, including apples, almonds and tomatoes, depends on pollination by bees and other insects.","Unfortunately, bee populations have been falling in many parts of the world. Scientists believe there are several reasons for this. The use of chemicals on farms can poison bees, while the loss of wild flowers and natural habitats leaves them with less food. Climate change is also a problem, because warmer temperatures can cause flowers to bloom before bees are active.","The good news is that ordinary people can help. Planting flowers in gardens and on balconies provides bees with food, and avoiding chemical sprays protects them from harm. Some cities have even started putting beehives on the roofs of buildings. If we act now, we can make sure that these hard-working insects continue to support our food supply."],

["According to the text, pollination allows plants to:",["produce fruits and seeds","grow faster in winter","avoid chemicals","make nectar"],"This process, called pollination, allows plants to produce fruits and seeds."],

g:["Second conditional (unreal present): If + past simple, then would + verb.","Use \"since\" with a starting point (2019) and \"for\" with a period of time.","An action finished before another past action takes the past perfect (had + V3).","Future passive: will be + V3. Results don't announce themselves.","\"be used to\" is followed by -ing because \"to\" is a preposition here.","Reported question: use statement word order and move the tense back.","\"whose\" shows possession (the student's laptop).","\"should have + V3\" criticises something that didn't happen in the past.","With \"neither… nor\", the verb agrees with the nearer subject (students → were).","After \"wish\" (a present wish), move the tense back: can → could.","\"stop + -ing\" = quit an activity. \"stop + to\" = stop in order to do something else.","\"such a + adjective + singular noun\". \"so\" goes with an adjective alone (so difficult).","Zero conditional for scientific facts: present simple in both clauses.","Past perfect continuous: an action that continued up to another moment in the past.","\"The + comparative…, the + comparative\" = the more…, the more…","\"would rather\" + a different subject takes the past simple.","\"despite\" is followed by a noun or -ing, not a full clause.","\"need + -ing\" has a passive meaning (it needs to be charged).","Long adjectives form the superlative with \"the most\".","\"unless\" = if not. Use the present simple after it, not \"will\".","\"few\" + plural noun = almost none (negative). \"a few\" = some (positive).","\"yet\" is used in negatives and questions: \"Not yet\".","\"suggest\" is followed by -ing (or a that-clause), never by \"to\".","In a non-defining clause (between commas), use \"which\", not \"that\".","\"so far\" signals the present perfect (experience up to now).","A long past action (past continuous) was interrupted by a short one (past simple).","Third conditional (unreal past): If + had V3, then would have + V3.","Past passive: was/were + V3. The bridge didn't build itself.","\"have to\" = obligation (a rule). \"mustn't\" = prohibited. \"don't have to\" = not necessary.","Use \"any\" in questions. Milk is uncountable, so not \"many\" or \"few\".","One-syllable adjectives add -er + than.","To express purpose, use to + infinitive.","\"who\" is for people, \"which\" is for things.","Reported speech: will → would.","\"It's time + subject + past simple\" = it's time somebody did something.","\"look forward to\" is followed by -ing because \"to\" is a preposition.","\"already\" in positive present perfect sentences = earlier than expected.","Future continuous (will be + -ing) for an action in progress at a future time.","\"can't be\" = logical certainty that something is impossible. Modals take the bare infinitive.","\"let + object + bare infinitive\" (no \"to\").","\"make + object + bare infinitive\" = force somebody to do something.","\"so many\" + plural countable noun + that.","\"since\" + a point in time (last summer).","\"unless\" = if not. First conditional, so \"will\" goes in the main clause.","\"so + adjective + that\". \"such\" needs a noun after it.","\"If I were you, I would…\" is used to give advice.","\"deny\" is followed by -ing.","\"mustn't\" = strictly prohibited. \"don't have to\" = not necessary."],
f:["To agree to \"Would you mind…?\", answer in the negative: \"Not at all\".","Good news → \"Congratulations!\". \"Good luck\" is said before an event.","A polite phone reply: the person isn't available + an offer to take a message.","A polite request to a stranger: \"Excuse me, could you…?\"","Reply to an apology with \"That's OK\". \"You're welcome\" answers thanks.","\"How about…?\" is a suggestion, so accept or refuse it.","When someone can't come, express regret: \"What a pity\".","Ordering in a restaurant: \"I'll have…\" or \"I'd like…\".","\"I hope not\" = I don't want that to happen.","Accept a request with \"Sure\" + a follow-up question.","Giving advice: \"Why don't you…?\" or \"You should…\".","Reply to thanks: \"Don't mention it\" or \"You're welcome\".","\"No\" = the seat isn't taken. \"Go ahead\" = please sit down.","\"What does he look like?\" asks about appearance. \"What is he like?\" asks about personality.","\"How long does it take?\" asks about duration.","Polite disagreement: \"I see your point, but…\".","\"Shall I…?\" is an offer. Accept with \"That would be lovely\".","With a professor, use very formal language: \"Would it be possible…?\"","Reply to sympathy: \"Thank you, that's kind of you\".","\"What do you do?\" = What is your job? It doesn't ask what you are doing now.","\"can't make it\" = can't come, followed by another suggestion.","Refuse an offer politely: \"No, thanks\" + a reason.","A polite complaint: describe the problem + \"Could someone…?\"","Reply to good wishes: \"Thanks, you too!\"","\"I didn't catch that\" = I didn't hear or understand, so the speaker repeats.","Giving advice: \"If I were you, I'd…\".","\"Do you mind if…?\" Permission is given in the negative: \"No, go ahead\".","In a shop: \"Of course\" + directions to the fitting room.","When you give something to someone, say \"Here you are\".","\"What's the matter?\" = What's wrong? The answer states the problem.","To someone going on a trip: \"Have a great time!\"","Accept the request with a small condition.","Agree with a negative statement: \"Neither do I\" / \"Me neither\".","Agree with a positive statement: \"So do I\" / \"Me too\".","Ask politely for repetition: \"Sorry, could you repeat that, please?\"","\"How was…?\" asks for an opinion or impression.","\"How much?\" asks about price.","\"I'm just looking\" = I don't need help at the moment.","Accept an apology: \"Don't worry about it\".","A polite invitation: \"Would you like to…?\"","\"What time?\" asks for the exact time.","To someone who is ill: \"I hope you feel better soon\".","Giving directions: go straight on, turn left, take the second right.","\"I couldn't agree more\" = I completely agree.","Formal permission: \"May I…?\" + a reason.","Reassure someone: \"Don't worry, you'll be fine\".","\"How often?\" asks about frequency.","On the phone, introduce yourself with \"This is…\", not \"I am…\".","The answer names the drink you want.","\"Is it OK if…?\" → \"Sure, go ahead\".","\"Why don't we…?\" is a suggestion, not a question about reasons.","Reply to \"Happy birthday!\" with \"Thank you!\" only. It isn't the other person's birthday.","A formal email needs formal language: \"I apologise for + -ing\".","A request for a recommendation needs a specific suggestion.","The answer gives the location. The correct word order is \"where it is\", not \"where is it\".","When you meet someone: \"Nice to meet you, too\"."],
v:["cancel = call off (a flight, a meeting). prevent = stop, avoid = keep away from, refuse = say no.","\"fill in a form\" = complete it.","honest = always tells the truth. generous = likes giving.","give up = stop a habit. take up = start a hobby.","\"raise\" takes an object (raise prices). \"rise\" has no object (prices rise).","\"pay attention\" is a fixed collocation.","\"can't stand\" = can't tolerate.","\"the cost of living\" is a fixed expression.","\"do someone a favour\" is a fixed collocation.","cover = pay for (costs).","opportunity = a chance. occasion = a special event.","\"Don't hesitate to…\" = feel free to…","-ing adjectives describe the cause (boring). -ed adjectives describe feelings (bored).","lose = can't find. miss = fail to catch (a bus) or attend (a class).","\"find a balance\" is a common collocation.","improve = get better (skills). increase = get bigger (an amount).","\"look forward to\" = wait for something with pleasure.","purchase = buy.","temporary ↔ permanent.","deadline = the last date to do something.","suitable for = right for (a person for a job). convenient = fits your time or place.","put off = postpone. put on = wear. put out = extinguish.","\"pass a test\". \"succeed\" needs \"in\".","essential = necessary.","book a room or a ticket = reserve it.","miss the bus = arrive too late to catch it.","\"make a decision\" is the standard collocation.","hand in = submit (homework). hand out = distribute.","look after = take care of. look for = search for. look up = check in a dictionary.","go up = increase (prices).","bring up = raise a child.","user-friendly = easy to use.","meet = see someone for the first time.","be allowed = be permitted.","selfish ↔ generous.","enormous = huge.","expensive ↔ cheap.","switch off = turn off a device.","interested in. \"keen\" takes \"on\", and \"eager\" takes \"to\".","distance = the space between two places.","famous for = well known because of something.","adapt to = adjust to. adopt = take as your /* ---------- Grammar rules (used for explanations and the grammar reference) ---------- */
const RULES={
pres_simple:{t:["Present simple","Present simple (geniş zaman)","المضارع البسيط"],x:["Present simple for habits, routines and facts: every day, usually, often, always, never. Add -s for he/she/it.","Alışkanlıklar, rutinler ve gerçekler için present simple: every day, usually, often, always, never. he/she/it ile -s eklenir.","المضارع البسيط للعادات والحقائق: every day, usually, often, always, never. نضيف ‎-s مع he/she/it."],eg:"The library opens at 9 every day."},
pres_cont:{t:["Present continuous","Present continuous (şimdiki zaman)","المضارع المستمر"],x:["Present continuous (am/is/are + -ing) for actions happening now or around now, and for fixed future arrangements: now, at the moment, Look!, Listen!, this week.","Şu anda veya bu günlerde olan eylemler ve kesinleşmiş gelecek planları için present continuous (am/is/are + -ing): now, at the moment, Look!, Listen!, this week.","المضارع المستمر (am/is/are + -ing) لما يحدث الآن، وللمواعيد المستقبلية المرتبة: now, at the moment, Look!, Listen!, this week."],eg:"Be quiet! The baby is sleeping."},
past_simple:{t:["Past simple","Past simple (geçmiş zaman)","الماضي البسيط"],x:["Past simple (V2) for finished actions at a finished time: yesterday, last week, ago, in 2020, when I was a child.","Bitmiş bir zamanda bitmiş eylemler için past simple (V2): yesterday, last week, ago, in 2020, when I was a child.","الماضي البسيط (V2) لحدث انتهى في وقت منتهٍ: yesterday, last week, ago, in 2020, when I was a child."],eg:"She moved to Ankara two years ago."},
past_cont:{t:["Past continuous","Past continuous","الماضي المستمر"],x:["Past continuous (was/were + -ing) for a longer action in progress; past simple for the short action that interrupted it. Often with while / when.","Devam eden uzun eylem için past continuous (was/were + -ing), onu kesen kısa eylem için past simple. Genellikle while / when ile.","الماضي المستمر (was/were + -ing) لحدث طويل كان جارياً، والماضي البسيط للحدث القصير الذي قطعه. غالباً مع while و when."],eg:"I was walking home when it started to rain."},
pp_since:{t:["Present perfect + since / for","Present perfect + since / for","المضارع التام مع since و for"],x:["have/has + V3 for something that started in the past and continues now. since + a starting point (2019, Monday); for + a period (three years).","Geçmişte başlayıp hâlâ devam eden durumlar için have/has + V3. since + başlangıç noktası (2019, Monday); for + süre (three years).","have/has + V3 لشيء بدأ في الماضي وما زال مستمراً. since + نقطة البداية (2019, Monday)، و for + مدة (three years)."],eg:"I have lived here since 2019 / for three years."},
pp_adv:{t:["Present perfect: already, yet, just, ever","Present perfect: already, yet, just, ever","المضارع التام: already, yet, just, ever"],x:["Present perfect for experiences and recent actions with no finished time: already (positive), yet (negatives and questions), just (a moment ago), ever/never (experience), so far, twice.","Bitmiş zaman belirtilmeyen deneyimler ve yakın geçmiş için present perfect: already (olumlu), yet (olumsuz ve soru), just (az önce), ever/never (deneyim), so far, twice.","المضارع التام للتجارب والأحداث القريبة بدون وقت منتهٍ: already (في المثبت)، yet (في النفي والسؤال)، just (للتو)، ever/never (للتجربة)، so far، twice."],eg:"Have you ever been to Rome? I haven't finished yet."},
ppc:{t:["Present perfect continuous","Present perfect continuous","المضارع التام المستمر"],x:["have/has been + -ing stresses how long an activity has continued up to now: for two hours, all day, since morning, How long…?","have/has been + -ing, bir eylemin şimdiye kadar ne kadar sürdüğünü vurgular: for two hours, all day, since morning, How long…?","have/has been + -ing يركز على مدة استمرار نشاط حتى الآن: for two hours, all day, since morning, How long…?"],eg:"I have been waiting for an hour."},
past_perf:{t:["Past perfect","Past perfect","الماضي التام"],x:["had + V3 for an action that happened before another past action. Signals: by the time, before, after, already, when.","Geçmişteki başka bir eylemden önce olan eylem için had + V3. İpuçları: by the time, before, after, already, when.","had + V3 لحدث وقع قبل حدث آخر في الماضي. كلماته: by the time, before, after, already, when."],eg:"When we arrived, the train had left."},
fut_will:{t:["Future: will","Gelecek zaman: will","المستقبل: will"],x:["will + verb for predictions, promises, offers and decisions made at the moment of speaking.","Tahminler, sözler, teklifler ve konuşma anında verilen kararlar için will + fiil.","will + فعل للتوقعات والوعود والعروض والقرارات التي نتخذها لحظة الكلام."],eg:"It's cold. I'll close the window."},
fut_going:{t:["Future: be going to","Gelecek zaman: be going to","المستقبل: be going to"],x:["be going to + verb for plans decided before speaking, and for predictions based on what we can see now.","Önceden verilmiş kararlar ve şu an görülen kanıta dayalı tahminler için be going to + fiil.","be going to + فعل للخطط المقررة مسبقاً، وللتوقع المبني على دليل نراه الآن."],eg:"Look at those clouds. It's going to rain."},
fut_cont:{t:["Future continuous","Future continuous","المستقبل المستمر"],x:["will be + -ing for an action that will be in progress at a certain time in the future.","Gelecekte belirli bir anda devam ediyor olacak eylemler için will be + -ing.","will be + -ing لحدث سيكون جارياً في وقت محدد في المستقبل."],eg:"At 8 tomorrow I'll be flying to Rome."},
fut_perf:{t:["Future perfect","Future perfect","المستقبل التام"],x:["will have + V3 for an action that will be finished before a time in the future. Signal: by + time.","Gelecekteki bir zamandan önce bitmiş olacak eylemler için will have + V3. İpucu: by + zaman.","will have + V3 لحدث سينتهي قبل وقت في المستقبل. كلمته الدالة: by + وقت."],eg:"By June, I will have finished my degree."},
used_to:{t:["used to / be used to","used to / be used to","used to و be used to"],x:["used to + verb = a past habit or state that is no longer true. be/get used to + -ing = be/become accustomed to something.","used to + fiil = artık geçerli olmayan geçmiş alışkanlık. be/get used to + -ing = bir şeye alışkın olmak / alışmak.","used to + فعل = عادة في الماضي لم تعد موجودة. be/get used to + ‎-ing = معتاد على / يعتاد على."],eg:"I used to live in Izmir. Now I'm used to living alone."},
cond0:{t:["Zero conditional","Sıfır koşul (Type 0)","الشرط الصفري"],x:["For general truths and scientific facts: If + present simple, present simple.","Genel ve bilimsel gerçekler için: If + present simple, present simple.","للحقائق العامة والعلمية: If + مضارع بسيط، ثم مضارع بسيط."],eg:"If you heat water to 100°C, it boils."},
cond1:{t:["First conditional","Birinci koşul (Type 1)","الشرط الأول"],x:["For real future possibilities: If + present simple, will + verb. Never use will after if, when, until, as soon as.","Gerçek gelecek olasılıkları için: If + present simple, will + fiil. if, when, until, as soon as'ten sonra will kullanılmaz.","لاحتمال حقيقي في المستقبل: If + مضارع بسيط، ثم will + فعل. لا نستخدم will بعد if و when و until و as soon as."],eg:"If it rains, we will stay at home."},
cond2:{t:["Second conditional","İkinci koşul (Type 2)","الشرط الثاني"],x:["For unreal or unlikely present situations: If + past simple, would + verb. Use were for all persons (If I were you…).","Şimdiki zamanda gerçek dışı durumlar için: If + past simple, would + fiil. Tüm şahıslarla were (If I were you…).","لحالة غير حقيقية في الحاضر: If + ماضٍ بسيط، ثم would + فعل. نستخدم were مع كل الضمائر (If I were you…)."],eg:"If I were rich, I would travel the world."},
cond3:{t:["Third conditional","Üçüncü koşul (Type 3)","الشرط الثالث"],x:["For imaginary past situations: If + had + V3, would have + V3.","Geçmişe dair hayalî durumlar için: If + had + V3, would have + V3.","لماضٍ لم يحدث: If + had + V3، ثم would have + V3."],eg:"If I had studied, I would have passed."},
unless:{t:["unless","unless","unless"],x:["unless = if not. It is followed by a positive verb in the present simple, not will.","unless = if not. Ardından will değil, olumlu present simple gelir.","unless = if not، ويأتي بعدها فعل مثبت في المضارع البسيط وليس will."],eg:"You won't pass unless you study."},
wish:{t:["wish","wish","wish (التمني)"],x:["wish + past simple for present wishes; wish + had + V3 for past regrets; wish + could for abilities.","Şimdiki dilekler için wish + past simple; geçmiş pişmanlıklar için wish + had + V3; yetenekler için wish + could.","wish + ماضٍ بسيط لأمنية في الحاضر، و wish + had + V3 لندم على الماضي، و wish + could للقدرة."],eg:"I wish I had more time. I wish I had gone."},
passive:{t:["The passive","Edilgen yapı (Passive)","المبني للمجهول"],x:["be + V3, used when the doer is unknown or unimportant. Only 'be' changes with the tense: is made, was made, has been made, will be made, must be made.","be + V3; eylemi yapan bilinmediğinde veya önemsiz olduğunda kullanılır. Zamana göre sadece 'be' değişir: is made, was made, has been made, will be made, must be made.","be + V3، ويُستخدم عندما يكون الفاعل غير معروف أو غير مهم. يتغير be فقط حسب الزمن: is made, was made, has been made, will be made, must be made."],eg:"The museum was built in 1990."},
causative:{t:["have / get something done","Ettirgen: have / get something done","have / get something done"],x:["have/get + object + V3 = someone else does the job for you.","have/get + nesne + V3 = işi başkası senin için yapar.","have/get + مفعول + V3 = شخص آخر يقوم بالعمل لك."],eg:"I had my hair cut yesterday."},
gerund:{t:["Verbs + -ing","Fiil + -ing","أفعال يتبعها ‎-ing"],x:["These verbs are followed by -ing: enjoy, avoid, finish, mind, suggest, deny, keep, consider, practise, give up, can't stand.","Bu fiillerden sonra -ing gelir: enjoy, avoid, finish, mind, suggest, deny, keep, consider, practise, give up, can't stand.","هذه الأفعال يتبعها ‎-ing: enjoy, avoid, finish, mind, suggest, deny, keep, consider, practise, give up, can't stand."],eg:"She enjoys reading."},
infinitive:{t:["Verbs + to","Fiil + to","أفعال يتبعها to"],x:["These verbs are followed by to + verb: want, decide, hope, plan, agree, refuse, promise, manage, afford, would like, seem.","Bu fiillerden sonra to + fiil gelir: want, decide, hope, plan, agree, refuse, promise, manage, afford, would like, seem.","هذه الأفعال يتبعها to + فعل: want, decide, hope, plan, agree, refuse, promise, manage, afford, would like, seem."],eg:"We decided to stay."},
bare_inf:{t:["make / let / modals + verb","make / let / modal + yalın fiil","make / let / الأفعال الناقصة + فعل"],x:["make, let and modal verbs (can, must, should, will…) are followed by the verb without to.","make, let ve modal fiillerden (can, must, should, will…) sonra fiil to olmadan gelir.","make و let والأفعال الناقصة (can, must, should, will…) يتبعها الفعل بدون to."],eg:"My parents let me go."},
prep_ing:{t:["Preposition + -ing","Edat + -ing","حرف جر + ‎-ing"],x:["After a preposition (in, at, of, about, without, before, after, by…) the verb takes -ing.","Edatlardan sonra (in, at, of, about, without, before, after, by…) fiil -ing alır.","بعد حرف الجر (in, at, of, about, without, before, after, by…) يأتي الفعل بصيغة ‎-ing."],eg:"She is good at drawing."},
purpose:{t:["Purpose: to + verb","Amaç: to + fiil","الهدف: to + فعل"],x:["To express purpose use to + verb (or in order to / so that), not 'for + verb'.","Amaç bildirmek için to + fiil (veya in order to / so that) kullanılır, 'for + fiil' kullanılmaz.","للتعبير عن الهدف نستخدم to + فعل (أو in order to / so that)، وليس for + فعل."],eg:"I went to the bank to get some money."},
stop_remember:{t:["remember / stop / forget + -ing or to","remember / stop / forget + -ing veya to","remember / stop / forget مع ‎-ing أو to"],x:["remember/forget/stop + -ing = the action itself or a past memory. + to = the purpose, or something you must do.","remember/forget/stop + -ing = eylemin kendisi veya geçmiş bir hatıra. + to = amaç veya yapılması gereken iş.","remember/forget/stop + ‎-ing = الفعل نفسه أو ذكرى من الماضي. و + to = الهدف أو مهمة يجب القيام بها."],eg:"Remember to lock the door. I remember meeting her."},
rel_who:{t:["Relative pronouns: who, which, where, when","İlgi zamirleri: who, which, where, when","ضمائر الوصل: who, which, where, when"],x:["who for people, which for things, that for both (not after a comma), where for places, when for times.","İnsanlar için who, nesneler için which, ikisi için that (virgülden sonra değil), yerler için where, zamanlar için when.","who للأشخاص، which للأشياء، that للاثنين (ليس بعد فاصلة)، where للأماكن، when للأزمنة."],eg:"The city where I was born is small."},
rel_whose:{t:["whose","whose","whose"],x:["whose shows possession: the man whose car… = the man's car.","whose sahiplik bildirir: the man whose car… = adamın arabası.","whose تدل على الملكية: the man whose car… = سيارة الرجل."],eg:"That's the girl whose brother is a pilot."},
rel_nondef:{t:["Non-defining relative clauses","Tanımlayıcı olmayan yan cümleler","الجمل الوصفية غير المحددة"],x:["In a clause between commas (extra information) use who or which, never that.","Virgüllerle ayrılan (ek bilgi veren) yan cümlede who veya which kullanılır, asla that kullanılmaz.","في الجملة بين فاصلتين (معلومة إضافية) نستخدم who أو which، ولا نستخدم that أبداً."],eg:"My sister, who lives in Paris, is a doctor."},
must_have_to:{t:["must / have to / mustn't / don't have to","must / have to / mustn't / don't have to","must / have to / mustn't / don't have to"],x:["must / have to = obligation. mustn't = prohibited. don't have to / needn't = not necessary. he/she/it has to.","must / have to = zorunluluk. mustn't = yasak. don't have to / needn't = gerekli değil. he/she/it has to.","must / have to = إلزام. mustn't = ممنوع. don't have to / needn't = غير ضروري. ومع he/she/it نقول has to."],eg:"You mustn't smoke here, but you don't have to leave."},
should:{t:["should / should have","should / should have","should و should have"],x:["should + verb = advice. should have + V3 = criticism or regret about the past.","should + fiil = tavsiye. should have + V3 = geçmişe dair eleştiri veya pişmanlık.","should + فعل = نصيحة. should have + V3 = لوم أو ندم على الماضي."],eg:"You should see a doctor. You should have told me."},
deduction:{t:["Deduction: must, can't, might","Çıkarım: must, can't, might","الاستنتاج: must, can't, might"],x:["must = almost certainly true; can't = almost certainly not true; might/may/could = possibly. Past: must have / can't have + V3.","must = neredeyse kesin doğru; can't = neredeyse kesin yanlış; might/may/could = belki. Geçmiş: must have / can't have + V3.","must = شبه مؤكد، can't = مستحيل تقريباً، might/may/could = ربما. وللماضي: must have / can't have + V3."],eg:"He must be tired. It must have rained."},
ability:{t:["Ability: can, could, was able to","Yetenek: can, could, was able to","القدرة: can, could, was able to"],x:["can / could = general ability (could for the past). For one specific success in the past use was/were able to or managed to.","can / could = genel yetenek (geçmiş için could). Geçmişte belirli bir başarı için was/were able to veya managed to.","can / could = قدرة عامة (could للماضي). ولنجاح محدد في الماضي نستخدم was/were able to أو managed to."],eg:"I could swim at five. We were able to catch the last bus."},
comparative:{t:["Comparatives and superlatives","Karşılaştırma ve üstünlük","المقارنة والتفضيل"],x:["Short adjectives: -er than / the -est. Long adjectives: more … than / the most. Irregular: good-better-best, bad-worse-worst.","Kısa sıfatlar: -er than / the -est. Uzun sıfatlar: more … than / the most. Düzensiz: good-better-best, bad-worse-worst.","الصفات القصيرة: ‎-er than / the -est. الطويلة: more … than / the most. الشاذة: good-better-best, bad-worse-worst."],eg:"This exam is easier than the last one."},
as_as:{t:["as … as","as … as","as … as"],x:["as + adjective + as = equal; not as … as = less. Use the normal adjective, not the comparative.","as + sıfat + as = eşitlik; not as … as = daha az. Karşılaştırma sıfatı değil, sıfatın yalın hâli kullanılır.","as + صفة + as = مساواة، و not as … as = أقل. نستخدم الصفة العادية وليس صيغة المقارنة."],eg:"Ali is as tall as his father."},
so_such:{t:["so / such","so / such","so و such"],x:["so + adjective/adverb (+ that); such (a/an) + adjective + noun (+ that). Uncountable nouns take such without a.","so + sıfat/zarf (+ that); such (a/an) + sıfat + isim (+ that). Sayılamayan isimlerde a olmadan such.","so + صفة/ظرف (+ that)، و such (a/an) + صفة + اسم (+ that). ومع غير المعدود such بدون a."],eg:"It was such a hot day that we stayed inside."},
too_enough:{t:["too / enough","too / enough","too و enough"],x:["too + adjective = more than needed. adjective + enough / enough + noun = sufficient.","too + sıfat = gereğinden fazla. sıfat + enough / enough + isim = yeterli.","too + صفة = أكثر من اللازم. صفة + enough أو enough + اسم = كافٍ."],eg:"The coffee is too hot to drink. He isn't old enough to drive."},
adverbs:{t:["Adjectives and adverbs","Sıfatlar ve zarflar","الصفات والظروف"],x:["Adjectives describe nouns (a quick car); adverbs describe verbs (drive quickly). Irregular: good → well, fast → fast, hard → hard.","Sıfatlar isimleri (a quick car), zarflar fiilleri niteler (drive quickly). Düzensiz: good → well, fast → fast, hard → hard.","الصفة تصف الاسم (a quick car)، والظرف يصف الفعل (drive quickly). الشاذة: good → well, fast → fast, hard → hard."],eg:"She speaks English very well."},
quant:{t:["Quantifiers: much, many, few, little","Miktar: much, many, few, little","الكميات: much, many, few, little"],x:["many / a few / few + plural countable nouns; much / a little / little + uncountable nouns. few / little = almost none; a few / a little = some.","many / a few / few + sayılabilen çoğul isim; much / a little / little + sayılamayan isim. few / little = neredeyse hiç; a few / a little = biraz.","many / a few / few مع الجمع المعدود، و much / a little / little مع غير المعدود. few / little = تقريباً لا شيء، و a few / a little = قليل لكنه موجود."],eg:"I have a little money and a few friends."},
some_any:{t:["some / any / no","some / any / no","some / any / no"],x:["some in positive sentences, offers and requests; any in negatives and questions; no = not any.","Olumlu cümleler, teklifler ve ricalarda some; olumsuz cümleler ve sorularda any; no = not any.","some في المثبت والعروض والطلبات، و any في النفي والسؤال، و no = not any."],eg:"Would you like some tea? There isn't any milk."},
articles:{t:["Articles: a, an, the","Artikeller: a, an, the","أدوات التعريف والتنكير: a, an, the"],x:["a/an = one of many or first mention (an before a vowel sound; also for jobs). the = a specific thing, something already mentioned, or something unique (the sun, the moon).","a/an = herhangi biri veya ilk kez söz edilen (sesli harften önce an; meslekler için de). the = belirli, daha önce söz edilen veya tek olan şey (the sun, the moon).","a/an = واحد من عدة أو أول ذكر (an قبل صوت متحرك، ومع المهن). the = شيء محدد أو سبق ذكره أو فريد (the sun, the moon)."],eg:"She is an engineer. The moon is bright tonight."},
reported:{t:["Reported statements","Dolaylı anlatım (cümleler)","الكلام المنقول (الجمل)"],x:["The tense moves one step back (am → was, will → would, have done → had done), and time words change (tomorrow → the next day).","Zaman bir derece geriye kayar (am → was, will → would, have done → had done) ve zaman ifadeleri değişir (tomorrow → the next day).","يرجع الزمن خطوة (am → was, will → would, have done → had done)، وتتغير كلمات الوقت (tomorrow → the next day)."],eg:"She said she was tired."},
reported_q:{t:["Reported questions","Dolaylı sorular","الأسئلة المنقولة"],x:["Reported questions use statement word order (no do/did, no inversion). Yes/no questions use if or whether.","Dolaylı sorularda düz cümle sırası kullanılır (do/did yok, devrik yapı yok). Evet/hayır sorularında if veya whether kullanılır.","السؤال المنقول يأخذ ترتيب الجملة الخبرية (بدون do/did وبدون قلب). وأسئلة نعم/لا تأخذ if أو whether."],eg:"She asked me if I was hungry. He asked where I lived."},
reported_cmd:{t:["Reported orders and requests","Dolaylı emir ve ricalar","الأوامر والطلبات المنقولة"],x:["tell / ask + someone + (not) to + verb.","tell / ask + kişi + (not) to + fiil.","tell / ask + شخص + (not) to + فعل."],eg:"The teacher told us not to talk."},
prep_time:{t:["Prepositions of time","Zaman edatları","حروف جر الوقت"],x:["at + clock times, night, the weekend; on + days and dates; in + months, years, seasons and parts of the day.","Saatler, night, the weekend ile at; günler ve tarihlerle on; aylar, yıllar, mevsimler ve günün bölümleriyle in.","at مع الساعات و night و the weekend، و on مع الأيام والتواريخ، و in مع الشهور والسنوات والفصول وأجزاء اليوم."],eg:"at 9 o'clock, on Monday, in July, in the morning"},
prep_place:{t:["Prepositions of place","Yer edatları","حروف جر المكان"],x:["at a point (at the station, at the door), in an enclosed space or a city (in the room, in Istanbul), on a surface (on the table, on the wall).","Bir noktada at (at the station, at the door), kapalı alan veya şehirde in (in the room, in Istanbul), yüzeyde on (on the table, on the wall).","at لنقطة (at the station, at the door)، و in لمكان مغلق أو مدينة (in the room, in Istanbul)، و on لسطح (on the table, on the wall)."],eg:"The keys are on the table in the kitchen."},
linkers:{t:["Linkers: although, despite, however, because","Bağlaçlar: although, despite, however, because","أدوات الربط: although, despite, however, because"],x:["Contrast: although + clause; despite + noun or -ing; however starts a new sentence. Reason: because + clause; because of + noun.","Zıtlık: although + cümle; despite + isim veya -ing; however yeni bir cümle başlatır. Sebep: because + cümle; because of + isim.","التضاد: although + جملة، و despite + اسم أو ‎-ing، و however تبدأ جملة جديدة. السبب: because + جملة، و because of + اسم."],eg:"Although it rained, we went out. Despite the rain, we went out."},
tags:{t:["Question tags","Soru ekleri","الأسئلة الذيلية"],x:["Positive sentence → negative tag; negative sentence → positive tag, with the same auxiliary (is/does/did/have/will…).","Olumlu cümle → olumsuz ek; olumsuz cümle → olumlu ek; aynı yardımcı fiille (is/does/did/have/will…).","جملة مثبتة ← ذيل منفي، وجملة منفية ← ذيل مثبت، بنفس الفعل المساعد (is/does/did/have/will…)."],eg:"You're a student, aren't you? She didn't call, did she?"},
so_neither:{t:["So do I / Neither do I","So do I / Neither do I","So do I و Neither do I"],x:["After a positive sentence: So + auxiliary + subject. After a negative sentence: Neither + auxiliary + subject. Use the same auxiliary as the first sentence.","Olumlu cümleden sonra: So + yardımcı fiil + özne. Olumsuz cümleden sonra: Neither + yardımcı fiil + özne. İlk cümledeki yardımcı fiil kullanılır.","بعد جملة مثبتة: So + فعل مساعد + فاعل. وبعد جملة منفية: Neither + فعل مساعد + فاعل. بنفس الفعل المساعد في الجملة الأولى."],eg:"I can swim. So can I. I don't eat meat. Neither do I."},
would_rather:{t:["would rather / had better","would rather / had better","would rather و had better"],x:["would rather + verb (no to) = prefer. had better + verb (no to) = strong advice.","would rather + fiil (to'suz) = tercih etmek. had better + fiil (to'suz) = güçlü tavsiye.","would rather + فعل بدون to = يفضّل. had better + فعل بدون to = نصيحة قوية."],eg:"I'd rather stay home. You'd better hurry."},
question_form:{t:["Question forms","Soru yapısı","تكوين السؤال"],x:["Questions: (question word) + auxiliary + subject + verb. When who/what is the subject, there is no auxiliary: Who called you?","Sorular: (soru kelimesi) + yardımcı fiil + özne + fiil. who/what özne ise yardımcı fiil yoktur: Who called you?","السؤال: (أداة سؤال) + فعل مساعد + فاعل + فعل. وإذا كان who/what هو الفاعل فلا يوجد فعل مساعد: Who called you?"],eg:"Where did you go? Who wrote this book?"},
indirect_q:{t:["Indirect questions","Dolaylı (kibar) sorular","الأسئلة غير المباشرة"],x:["After Could you tell me… / Do you know… use statement word order (subject + verb), with no do/does/did.","Could you tell me… / Do you know… yapılarından sonra düz cümle sırası (özne + fiil) kullanılır; do/does/did kullanılmaz.","بعد Could you tell me… و Do you know… نستخدم ترتيب الجملة الخبرية (فاعل + فعل)، بدون do/does/did."],eg:"Do you know where the station is?"}
};

{t:"Tea in Turkish Daily Life",x:["Although Turkey is famous for its coffee, tea is the drink that most people have every day. Tea plants grow well in the rainy climate of the Black Sea region, especially around Rize, where tea farming became widespread in the twentieth century.","Turkish tea is usually prepared in a special double teapot called a çaydanlık. Water boils in the large bottom pot, while strong tea brews in the small pot on top. Each person can then decide how strong or light they want their tea by adding hot water.","Tea is served in small, tulip-shaped glasses, without milk. Offering tea to guests is a sign of hospitality, and it is common to drink several glasses during a single conversation."],

{t:"Why Breakfast Matters",x:["Many students skip breakfast because they wake up late or are not hungry in the morning. However, nutrition experts say that a good breakfast can improve both concentration and mood during the day.","After a night without food, the body needs energy. A breakfast that includes protein, such as eggs or cheese, and whole grains, such as brown bread, releases energy slowly. This helps students stay focused in morning lectures. On the other hand, sugary cereals and pastries give a quick burst of energy that soon disappears, leaving people tired and hungry again.","For those who are always in a hurry, experts suggest preparing something simple the night before, such as yoghurt with fruit and nuts."],

{t:"Shopping Online",x:["Online shopping has grown enormously in the last ten years. With just a few clicks, people can buy almost anything, from books to furniture, and have it delivered to their door. For busy people, this saves a lot of time.","However, online shopping also has disadvantages. Customers cannot touch or try on products, so clothes and shoes are often returned because they do not fit. In addition, some websites are not secure, and shoppers' personal information can be stolen.","Experts advise shoppers to use well-known websites, read other customers' reviews and check the return policy before buying. They also recommend never saving card details on a website that looks suspicious."],

{t:"My First Day as an Intern",x:["I will never forget my first day as an intern at a design company in Berlin. I arrived thirty minutes early because I was so nervous. The office was huge and full of people working on large computer screens.","My manager, Anna, introduced me to the team and gave me my first task: to create a simple poster for a café. I was terrified of making mistakes, but my colleagues were very patient. Whenever I had a question, someone was happy to help.","At the end of the day, Anna looked at my poster and said it was \"a great start\". I left the office with a huge smile. That internship taught me that asking questions is not a weakness but the best way to learn."],

{t:"Electric Scooters in the City",x:["In recent years, electric scooters have appeared in cities all over the world. They are cheap to rent, easy to use and do not produce exhaust fumes, so many people see them as a green way to travel short distances.","However, not everyone is happy about them. Pedestrians complain that riders often use the pavement and that scooters are left in the middle of the street. There have also been a number of accidents, partly because many riders do not wear helmets.","As a result, some cities have introduced new rules. In several places, riders must now be over 18, scooters are not allowed on pavements, and speed is limited to 20 km/h. Supporters hope these rules will make scooters safer without making them less popular."],

{t:"Final Exams: Rules for Students",x:["Students must arrive at the exam room at least 15 minutes before the exam starts. You must bring your student ID card; students without ID will not be allowed to enter.","Mobile phones, smart watches and other electronic devices must be switched off and left in your bag at the front of the room. Only a pen, a pencil and an eraser are allowed on the desk. Calculators may be used only if your teacher has given permission.","Students who finish early may leave after the first 30 minutes, but not during the last 10 minutes. Anyone found cheating will receive a zero and may be reported to the faculty."],

{t:"A Weekend in Cappadocia",x:["Last weekend, I finally visited Cappadocia, a region in central Turkey famous for its strange rock formations called \"fairy chimneys\". We left Bandırma by night bus and arrived early on Saturday morning.","The highlight of the trip was a hot-air balloon ride at sunrise. It was expensive, but floating silently above the valleys while the sky turned pink was worth every lira. In the afternoon, we explored an underground city where people once hid from enemies. The tunnels were so narrow that we sometimes had to walk bent over.","My only advice is to book the balloon ride early, because flights are often full and can be cancelled if the wind is too strong."],

{t:"Coffee Around the World",x:["For many people around the world, the day does not really begin until they have had their first cup of coffee. Coffee is one of the most traded products on Earth, and the way people drink it differs from country to country.","In Italy, espresso is drunk quickly while standing at the bar, and ordering a cappuccino after lunch is considered unusual. In Turkey, coffee is boiled slowly in a small pot and served with a glass of water and often something sweet. In Finland, people drink more coffee per person than almost anywhere else, often several large cups a day.","Despite these differences, coffee has one thing in common everywhere: it brings people together. Meeting \"for a coffee\" is often more about the conversation than the drink itself."],

{t:"Protecting Sea Turtles",x:["After finishing her second year at university, Defne spent two months volunteering at a sea turtle protection project in Greece. Every night, she and the other volunteers walked along the beach looking for turtles coming out of the sea to lay their eggs.","The work was not always easy. The volunteers often slept only a few hours, and the summer heat during the day was exhausting. They also had to explain to tourists why they should not leave rubbish or use bright lights on the beach at night, because these can confuse the baby turtles.","Despite the difficulties, Defne says it was the most meaningful summer of her life. \"I learned teamwork, patience and some Greek,\" she laughs. \"And seeing the baby turtles reach the sea for the first time was unforgettable.\""],

{t:"The Four-Day Work Week",x:["In several countries, companies have been testing a four-day working week, in which employees work 32 hours instead of 40 but receive the same salary. The idea is that people who have more free time will be happier, healthier and more productive.","Results from some trials have been surprisingly positive. Many companies reported that productivity stayed the same or even increased, while staff took fewer sick days. Employees said they had more time for their families, hobbies and exercise.","However, critics point out that a shorter week may not work for every job. Hospitals, shops and restaurants, for example, need staff every day. For these businesses, a four-day week could mean hiring more people, which would increase costs."],

["What happened in many trials?",["Productivity stayed the same or rose.","Workers took more sick days.","Companies lost money.","Employees became unhappy."],"detail","productivity stayed the same or even increased, while staff took fewer sick days"],
["Why might a four-day week be difficult for restaurants?",["They need staff every day.","They close at weekends.","Their workers do not want free time.","They are too small."],"detail","Hospitals, shops and restaurants, for example, need staff every day."],

{t:"The Lost Wallet",x:["Last Friday, Mert was waiting at a bus stop when he noticed a brown wallet on the ground. Inside there was 2,000 lira, a credit card and an ID card belonging to a woman called Ayla Demir.","Mert thought about what to do. He didn't want to give it to a stranger, and the police station was on the other side of the city. In the end, he searched for Ayla's name on social media and found her profile. He sent her a message, and an hour later they met at a café near the bus stop.","Ayla was so grateful that she offered Mert a reward, but he refused to take it. \"I just did what anyone should do,\" he said. Later, Ayla shared the story online, and it was seen by thousands of people."],

/* Find a dictionary entry for an option such as "taken up", "looking for" or "pick you up". */
function vkey(w){
  const words=String(w).toLowerCase().trim().split(/\s+/).filter(x=>!["it","you","them","me"].includes(x));
  if(!words.length) return null;
  const forms=f=>{const out=[f]; if(IRR[f]) out.push(IRR[f]); if(f.endsWith("ied")) out.push(f.slice(0,-3)+"y");
    for(const s of ["ing","ed","es","s","d"]) if(f.endsWith(s)&&f.length>s.length+2) out.push(f.slice(0,-s.length));
    if(f.endsWith("ing")) out.push(f.slice(0,-3)+"e"); return out;};
  for(const f of forms(words[0])){ const base=[f,...words.slice(1)].join(" "); for(const c of [base,base+" to",base+" with",base.replace(/ with$/,"")]) if(VOC[c]) return c; }
  return null;
}
