Object.assign(RULES,{
inversion:{t:["Negative inversion","Olumsuz devrik yapı","القلب بعد أدوات النفي"],x:["After a negative or limiting expression at the start of a sentence (Never, Rarely, Little, Not only, Under no circumstances, Only after…), use question word order: auxiliary + subject + verb.","Cümle başındaki olumsuz veya sınırlayıcı ifadelerden sonra (Never, Rarely, Little, Not only, Under no circumstances, Only after…) soru sırası kullanılır: yardımcı fiil + özne + fiil.","بعد تعبير نفي أو تقييد في بداية الجملة (Never, Rarely, Little, Not only, Under no circumstances, Only after…) نستخدم ترتيب السؤال: فعل مساعد + فاعل + فعل."],eg:"Never have I seen such a beautiful view."},
no_sooner:{t:["No sooner … than / Hardly … when","No sooner … than / Hardly … when","No sooner … than و Hardly … when"],x:["No sooner had + subject + V3 … than …; Hardly / Scarcely had + subject + V3 … when … = one thing happened immediately after another.","No sooner had + özne + V3 … than …; Hardly / Scarcely had + özne + V3 … when … = bir şey olur olmaz diğeri oldu.","No sooner had + فاعل + V3 … than …، و Hardly / Scarcely had + فاعل + V3 … when … = ما إن حدث شيء حتى حدث آخر."],eg:"No sooner had I arrived than it started to rain."},
mixed_cond:{t:["Mixed conditionals","Karma koşul cümleleri","الشرط المختلط"],x:["Mix past and present: If + had + V3, would + verb (past cause → present result); If + past simple, would have + V3 (present situation → past result).","Geçmiş ve şimdiyi karıştırır: If + had + V3, would + fiil (geçmiş sebep → şimdiki sonuç); If + past simple, would have + V3 (şimdiki durum → geçmiş sonuç).","يمزج الماضي بالحاضر: If + had + V3، ثم would + فعل (سبب في الماضي ← نتيجة في الحاضر)؛ و If + ماضٍ بسيط، ثم would have + V3 (حالة حاضرة ← نتيجة في الماضي)."],eg:"If I had taken that job, I would be living in London now."},
cond_alt:{t:["provided that, as long as, in case, otherwise","provided that, as long as, in case, otherwise","provided that, as long as, in case, otherwise"],x:["provided (that) / as long as = only if; in case = as a precaution; otherwise = if not. Like if, they take a present tense when talking about the future.","provided (that) / as long as = sadece …se; in case = ihtimale karşı; otherwise = aksi hâlde. if gibi, gelecekten söz ederken present tense alırlar.","provided (that) / as long as = بشرط أن، و in case = تحسباً، و otherwise = وإلا. ومثل if يأتي بعدها المضارع عند الحديث عن المستقبل."],eg:"Take an umbrella in case it rains."},
cond_inv:{t:["Inverted conditionals: Had I…, Should you…, Were I…","Devrik koşul: Had I…, Should you…, Were I…","الشرط المقلوب: Had I…, Should you…, Were I…"],x:["Formal conditionals without if: Had + subject + V3 (= If … had), Should + subject + verb (= If … happens to), Were + subject (= If … were).","if olmadan resmî koşul: Had + özne + V3 (= If … had), Should + özne + fiil (= If … olursa), Were + özne (= If … were).","شرط رسمي بدون if: Had + فاعل + V3 (= If … had)، و Should + فاعل + فعل (= إذا حدث أن)، و Were + فاعل (= If … were)."],eg:"Had I known, I would have helped. Should you need help, call me."},
if_only:{t:["if only / it's time / would rather + past","if only / it's time / would rather + geçmiş","if only / it's time / would rather + الماضي"],x:["if only = a strong wish (like wish). It's (high) time + subject + past simple = it should happen now. would rather + another subject + past simple.","if only = güçlü dilek (wish gibi). It's (high) time + özne + past simple = artık olmalı. would rather + başka özne + past simple.","if only = أمنية قوية (مثل wish). It's (high) time + فاعل + ماضٍ بسيط = حان الوقت. would rather + فاعل آخر + ماضٍ بسيط."],eg:"It's high time you started revising."},
passive_report:{t:["It is said that… / He is believed to…","It is said that… / He is believed to…","It is said that… / He is believed to…"],x:["Reporting passive: It is said/believed/thought that + clause, or Subject + is said/believed/thought + to + verb (to have + V3 for the past).","Aktarma edilgeni: It is said/believed/thought that + cümle veya Özne + is said/believed/thought + to + fiil (geçmiş için to have + V3).","المبني للمجهول للنقل: It is said/believed/thought that + جملة، أو فاعل + is said/believed/thought + to + فعل (و to have + V3 للماضي)."],eg:"The castle is believed to have been built in 1200."},
modal_perfect:{t:["Past modals: must have, can't have, needn't have, could have","Geçmiş modallar: must have, can't have, needn't have, could have","الأفعال الناقصة للماضي"],x:["Modal + have + V3 for the past: must have = I'm sure it happened; can't have = I'm sure it didn't; might have = maybe; could have = it was possible (often criticism); needn't have = it happened, but it wasn't necessary.","Geçmiş için modal + have + V3: must have = eminim oldu; can't have = eminim olmadı; might have = belki; could have = mümkündü (genellikle eleştiri); needn't have = oldu ama gerekli değildi.","فعل ناقص + have + V3 للماضي: must have = متأكد أنه حدث، can't have = متأكد أنه لم يحدث، might have = ربما، could have = كان ممكناً (غالباً للوم)، needn't have = حدث لكنه لم يكن ضرورياً."],eg:"You needn't have bought flowers, but thank you!"},
participle:{t:["Participle clauses","Ortaç (participle) yan cümleleri","جمل اسم الفاعل والمفعول"],x:["-ing clause = active meaning (Walking home, I saw…); V3 clause = passive meaning (Built in 1900, the house…); Having + V3 = an action completed before the main action.","-ing yan cümlesi = etken anlam (Walking home, I saw…); V3 yan cümlesi = edilgen anlam (Built in 1900, the house…); Having + V3 = ana eylemden önce tamamlanan eylem.","جملة ‎-ing = معنى مبني للمعلوم (Walking home, I saw…)، وجملة V3 = معنى مبني للمجهول (Built in 1900, the house…)، و Having + V3 = فعل انتهى قبل الفعل الرئيسي."],eg:"Having finished the report, she went home."},
cleft:{t:["Cleft sentences: It was … who / What I need is…","Vurgulu cümleler: It was … who / What I need is…","جمل التوكيد: It was … who / What I need is…"],x:["To emphasise one part: It is/was + focus + who/that…, or What + clause + is/was…","Bir bölümü vurgulamak için: It is/was + vurgulanan + who/that… veya What + cümle + is/was…","للتوكيد على جزء معين: It is/was + الجزء المؤكَّد + who/that…، أو What + جملة + is/was…"],eg:"What I need is a holiday. It was Ali who called."},
subjunctive:{t:["suggest / recommend / insist that + base verb","suggest / recommend / insist that + yalın fiil","suggest / recommend / insist that + فعل مجرد"],x:["After suggest, recommend, insist, demand, it is essential/important that…, use the base verb for every subject (no -s, no to), or should + verb.","suggest, recommend, insist, demand, it is essential/important that… yapılarından sonra her özne için yalın fiil kullanılır (-s yok, to yok) veya should + fiil.","بعد suggest و recommend و insist و demand و it is essential/important that… نستخدم الفعل المجرد مع كل الفاعلين (بدون ‎-s وبدون to)، أو should + فعل."],eg:"The doctor recommended that he take more exercise."},
as_if:{t:["as if / as though","as if / as though","as if / as though"],x:["as if / as though = in a way that suggests something. For unreal situations use the past (were, had + V3).","as if / as though = sanki. Gerçek dışı durumlar için geçmiş zaman kullanılır (were, had + V3).","as if / as though = كأنّ. وللحالات غير الحقيقية نستخدم الماضي (were, had + V3)."],eg:"She talks as if she were the boss."},
linkers_b2:{t:["Advanced linkers: whereas, nevertheless, due to, so as to","İleri bağlaçlar: whereas, nevertheless, due to, so as to","أدوات ربط متقدمة: whereas, nevertheless, due to, so as to"],x:["Contrast: whereas / while + clause; nevertheless / nonetheless start a new sentence. Reason: due to / owing to + noun. Purpose: so as to / in order to (not) + verb; so that + clause.","Zıtlık: whereas / while + cümle; nevertheless / nonetheless yeni cümle başlatır. Sebep: due to / owing to + isim. Amaç: so as (not) to / in order (not) to + fiil; so that + cümle.","التضاد: whereas / while + جملة، و nevertheless / nonetheless تبدأ جملة جديدة. السبب: due to / owing to + اسم. الهدف: so as (not) to / in order (not) to + فعل، و so that + جملة."],eg:"I love tea, whereas my sister prefers coffee."},
rel_prep:{t:["Formal relative clauses (to whom, which = whole clause)","Resmî ilgi cümleleri (to whom, tüm cümle için which)","جمل الوصل الرسمية (to whom، و which للجملة كلها)"],x:["Formal: preposition + whom/which (the person to whom I spoke). 'which' after a comma can refer to a whole clause: He passed, which surprised everyone.","Resmî: edat + whom/which (the person to whom I spoke). Virgülden sonra 'which' tüm cümleyi gösterebilir: He passed, which surprised everyone.","الرسمي: حرف جر + whom/which (the person to whom I spoke). و which بعد فاصلة قد تعود على الجملة كلها: He passed, which surprised everyone."],eg:"The professor to whom I spoke was very helpful."},
future_past:{t:["Future in the past: was going to / would","Geçmişte gelecek: was going to / would","المستقبل في الماضي: was going to / would"],x:["was/were going to and would describe the future as seen from a moment in the past; was going to often describes plans that did not happen.","was/were going to ve would, geçmişteki bir andan bakıldığında geleceği anlatır; was going to genellikle gerçekleşmeyen planlar içindir.","was/were going to و would تصف المستقبل كما كان يُرى من لحظة في الماضي، و was going to غالباً لخطط لم تتحقق."],eg:"I was going to call you, but I forgot."},
verb_patterns_b2:{t:["regret / try / mean + -ing or to","regret / try / mean + -ing veya to","regret / try / mean مع ‎-ing أو to"],x:["regret + -ing = be sorry about the past; regret to = formal bad news. try + -ing = experiment to see what happens; try to = make an effort. mean + -ing = involve; mean to = intend.","regret + -ing = geçmiş için pişmanlık; regret to = resmî kötü haber. try + -ing = ne olacağını görmek için denemek; try to = çabalamak. mean + -ing = gerektirmek; mean to = niyet etmek.","regret + ‎-ing = الندم على الماضي، و regret to = خبر سيئ رسمي. try + ‎-ing = تجربة حل، و try to = محاولة بجهد. mean + ‎-ing = يتطلب، و mean to = ينوي."],eg:"We regret to inform you… Try restarting the computer."},
would_habit:{t:["would / used to for past habits","Geçmiş alışkanlıklar: would / used to","would و used to للعادات الماضية"],x:["would + verb describes repeated actions in the past (not states). For past states (have, be, live, like) use used to.","would + fiil geçmişte tekrarlanan eylemleri anlatır (durumları değil). Geçmiş durumlar (have, be, live, like) için used to kullanılır.","would + فعل يصف أفعالاً متكررة في الماضي (وليس الحالات). وللحالات في الماضي (have, be, live, like) نستخدم used to."],eg:"Every summer we would swim in the river. I used to have long hair."}
});

{t:"Urban Heat Islands",x:["Cities are often several degrees warmer than the surrounding countryside, a phenomenon known as the urban heat island effect. The main cause is the replacement of natural land with concrete, asphalt and buildings, which absorb heat during the day and release it slowly at night. As a result, cities may stay uncomfortably warm long after sunset.","The consequences can be serious. During heatwaves, high night-time temperatures prevent the human body from recovering, which increases the risk of illness, particularly among elderly people. Higher temperatures also lead to greater demand for air conditioning, which in turn raises energy consumption and emissions.","Fortunately, several solutions have proved effective. Planting trees provides shade and cools the air through evaporation, while 'green roofs' covered with plants can reduce the temperature of buildings considerably. Some cities have even begun painting roofs and roads in lighter colours, which reflect rather than absorb sunlight. Experts argue that such measures will become increasingly important as global temperatures continue to rise."],

{t:"The Gig Economy",x:["Over the past decade, millions of people have begun earning a living through short-term, flexible jobs arranged via digital platforms, from food delivery to freelance design. This so-called 'gig economy' offers workers the freedom to choose when and how much they work, which many find particularly attractive.","However, critics argue that this flexibility comes at a cost. Since gig workers are usually classified as independent contractors rather than employees, they are often not entitled to sick pay, paid holidays or pension contributions. Their income can also vary unpredictably from week to week, making it difficult to plan for the future.","Governments are now under pressure to respond. In some countries, courts have ruled that certain platforms must treat their drivers as employees, while others are exploring a 'third category' of worker that would combine flexibility with basic protections. Whatever the outcome, it seems clear that the debate over the future of work is far from over."],

{t:"The Placebo Effect",x:["A placebo is a treatment with no active ingredient, such as a sugar pill. Remarkably, patients who receive placebos often report real improvements in their symptoms, particularly for conditions such as pain, anxiety and fatigue. This phenomenon, known as the placebo effect, has fascinated scientists for decades.","Researchers believe that a patient's expectations play a central role. When people believe they are receiving effective treatment, the brain may release natural painkillers and reduce stress responses. Interestingly, even the appearance of a treatment matters: studies have found that injections tend to produce stronger placebo effects than pills, and that more expensive-looking pills are often perceived as more effective.","Perhaps most surprisingly, some recent studies suggest that placebos can work even when patients know they are taking them. Although these 'open-label' placebos are not a substitute for real medicine, they raise intriguing questions about the connection between the mind and the body."],

{t:"The Hidden Costs of Fast Fashion",x:["Fast fashion refers to the rapid production of cheap clothing that copies the latest catwalk trends. Thanks to efficient global supply chains, some retailers can now move a design from the drawing board to the shop floor in just a few weeks. Consumers, in turn, buy far more clothes than previous generations did, and keep them for a much shorter time.","The environmental cost of this model is considerable. The textile industry is one of the largest consumers of water in the world, and synthetic fabrics release microplastics when washed. Moreover, a large proportion of discarded clothing ends up in landfill or is burned rather than recycled.","In response, a growing number of consumers are turning to second-hand shops, clothing rental services and 'capsule wardrobes' made up of a small number of versatile, high-quality items. Some brands have also introduced repair services and recycling schemes, although critics claim that these initiatives are often more about marketing than genuine change."],

{t:"Why We Procrastinate",x:["Almost everyone has put off an important task at some point, but for some people procrastination becomes a persistent habit that harms their studies, careers and wellbeing. Contrary to popular belief, procrastination is rarely the result of laziness. Psychologists increasingly see it as a problem of managing emotions rather than managing time.","According to this view, we delay tasks that make us feel anxious, bored or insecure. Avoiding the task brings immediate relief, which rewards the behaviour and makes it more likely to happen again. Unfortunately, the relief is short-lived: as the deadline approaches, stress increases, often along with feelings of guilt.","Experts suggest several strategies. Breaking a large task into smaller, more manageable steps can make it seem less threatening. Another technique is to commit to working on a task for just five minutes; once people have started, they frequently find it easier to continue. Finally, being kind to oneself after procrastinating, rather than self-critical, has been shown to reduce the likelihood of doing it again."],

{t:"Rewilding",x:["Rewilding is an approach to conservation that aims to restore ecosystems by allowing natural processes to take over, often by reintroducing species that have disappeared from an area. Rather than carefully managing every aspect of a landscape, rewilding projects try to step back and let nature repair itself.","One of the most famous examples took place in Yellowstone National Park in the United States, where wolves were reintroduced in 1995 after an absence of about seventy years. Their return reduced the number of elk, which had been overgrazing young trees along rivers. As vegetation recovered, riverbanks became more stable and other species, from birds to beavers, returned.","Nevertheless, rewilding is not without controversy. Farmers sometimes fear that predators will attack their livestock, and some critics argue that it is unrealistic to recreate ecosystems as they were centuries ago. Supporters respond that the aim is not to turn back the clock, but to create landscapes that are healthier and more resilient in the future."],

function tpSingle(prefix,list,kind){
  return list.map((a,i)=>{const id=prefix+i; const it={id,s:a.s||"g",q:a.q,o:a.o,tp:1};
    if(a.rk) it.rk=a.rk; if(a.fk) it.fk=a.fk; if(a.tk){it.tk=a.tk; it.ev=a.ev||"";}

    ITEMS[id]=it; return id;});
}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const perm4=()=>shuffle([0,1,2,3]);
/* Options are shuffled, except fixed answer sets such as True / False / Not Given */
const FIXED_ORDER=["True","False","Not Given"];
const permFor=id=>{const q=ITEMS[id]; const idx=q.o.map((_,i)=>i); return q.fixed?idx.sort((a,b)=>FIXED_ORDER.indexOf(q.o[a])-FIXED_ORDER.indexOf(q.o[b])):shuffle(idx);};

function buildExam(kind){
  let g,f,v,ps;
  if(kind>100){const k=kind-101;g=B2Q.g.slice(k*12,k*12+12);f=B2Q.f.slice(k*14,k*14+14);v=B2Q.v.slice(k*12,k*12+12);ps=[B2Q.p[2*k],B2Q.p[2*k+1]]}
  else if(kind>=1&&kind<=NEX){const k=kind-1;g=IDS.g.slice(k*12,k*12+12);f=IDS.f.slice(k*14,k*14+14);v=IDS.v.slice(k*12,k*12+12);ps=[2*k,2*k+1]}
  else{g=shuffle(IDS.g).slice(0,12);f=shuffle(IDS.f).slice(0,14);v=shuffle(IDS.v).slice(0,12);ps=shuffle(Array.from({length:NSTD_P},(_,i)=>i)).slice(0,2)}
  const ids=[...g,...f,...v,...ps.flatMap(pIds)];
  return ids.map(id=>({id,perm:perm4()}));
}
function buildPractice(s){
  if(s==="mist") return shuffle(mistIds()).slice(0,20).map(id=>({id,perm:perm4()}));
  if(s==="fav") return favs().map(id=>({id,perm:permFor(id)}));
  if(TESTSETS[s]) return TESTSETS[s]().map(id=>({id,perm:permFor(id)}));
  if(s==="daily"){const m=shuffle(mistIds()).slice(0,4); const pool=shuffle([...IDS.g,...IDS.f,...IDS.v]).filter(id=>!m.includes(id)); return [...m,...pool].slice(0,GOAL).map(id=>({id,perm:perm4()}));}
  const ids = s==="r" ? Array.from({length:NSTD_P},(_,i)=>i).flatMap(pIds) : shuffle(IDS[s]);
  return ids.map(id=>({id,perm:perm4()}));
}

const titleOf=x=>x.kind==="fav"?T("Favourites","Favoriler","المفضّلة"):TESTTITLES[x.kind]?TESTTITLES[x.kind]():x.kind==="mist"?T("Mistakes notebook","Yanlış defteri","دفتر الأخطاء"):x.kind==="daily"?T("Daily practice","Günlük alıştırma","التدريب اليومي"):x.kind!==undefined?(x.mode==="exam"?examTitle(x.kind):practiceTitle(x.kind)):(x.title||"");
const qCount=n=>T(n+" questions",n+" soru",n+" سؤال");
const fmtDate=ts=>{try{return new Date(ts).toLocaleDateString(T("en-GB","tr-TR","ar-EG"),{day:"numeric",month:"short"})}catch(e){return ""}};
function exText(q){
  if(q.rk){const r=RULES[q.rk]; return r?T(...r.x)+"\n"+T("Example: ","Örnek: ","مثال: ")+r.eg:"";}
  if(q.fk) return FUNCS[q.fk]?T(...FUNCS[q.fk]):"";
  if(q.vk) return q.o.map((w,i)=>{const k=vkey(w); return k?(i===0?"✓ ":"✗ ")+w+" = "+T(...VOC[k]):null}).filter(Boolean).join("\n");
  if(q.tk){const tt=RTYPES[q.tk]; return (tt?T(...tt):"")+(q.ev?"\n“"+q.ev+"”":"");}
  return (LANG==="en"&&q.en)||(LANG==="tr"&&q.tr)||q.e;
}

const LESSONS_EN=[
{g:"خطة",t:"Exam plan: how to use your time",b:`
<p>You have 120 minutes for 50 questions, which is about <b>2.5 minutes per question</b>. That is enough time if you use it well.</p>
${tb(["Section","Questions","Suggested time"],[["Grammar","12","15 min"],["Functional language","14","15 min"],["Vocabulary","12","15 min"],["Reading","12","45 min"],["Review and transfer answers","—","20 min"]])}
<ul><li><b>Never leave a question blank</b>: wrong answers don't lose points. If you don't know, cross out the clearly wrong options and guess.</li>
<li>If a question takes more than 2 minutes, mark it, move on, and come back at the end.</li>
<li>In reading, read the question first, then find the answer in the text.</li>
<li>You need 28 correct answers out of 50 to pass (56 points).</li></ul>`},
{g:"قواعد",t:"Tenses and their signal words",b:`
<p>Small words in the sentence tell you which tense is needed. Look for them first.</p>
${tb(["Tense","Form","Signal words"],[
["Present simple","I work","every day, usually, always, often"],
["Present continuous","I am working","now, at the moment, Look!"],
["Present perfect","I have worked","since, for, already, yet, just, ever, never, so far"],
["Past simple","I worked","yesterday, ago, last week, in 2020"],
["Past continuous","I was working","while, when (interrupted by another action)"],
["Past perfect","I had worked","by the time, before, after (an earlier past action)"],
["Future","will / be going to","tomorrow, next week, soon"]])}
${eg("She has lived here <b>since</b> 2019. / <b>for</b> five years.","<b>While</b> I was cooking, the phone rang.","<b>By the time</b> we arrived, the film had started.")}
<p><b>since</b> + a starting point (2019, Monday). <b>for</b> + a period (3 years, 2 hours).</p>`},
{g:"قواعد",t:"Conditionals and wish",b:`
${tb(["Type","Meaning","Form"],[
["0","General / scientific truth","If you heat ice, it melts."],
["1","Possible in the future","If it rains, I will stay home."],
["2","Unreal in the present","If I had money, I would travel."],
["3","Unreal in the past","If I had studied, I would have passed."]])}
<ul><li>unless = if not, and it is never followed by \"will\": Unless it rains, we'll go.</li>
<li>Advice: If I were you, I would… (\"were\" for all persons).</li>
<li>wish + past for the present: I wish I could / I wish I had. wish + had V3 for the past.</li></ul>`},
{g:"قواعد",t:"The passive",b:`
<p>Use it when the doer is unknown or unimportant. Form: <b>be + V3</b>. Only \"be\" changes with the tense.</p>
${tb(["Tense","Example"],[["Present","English is spoken here."],["Past","The bridge was built in 1973."],["Present perfect","The results have been announced."],["Future","The results will be announced."],["Modal","It must be done today."]])}
<p>Ask yourself: does the subject do the action? Results don't announce themselves, so the sentence is passive.</p>`},
{g:"قواعد",t:"Gerund or infinitive (-ing or to)?",b:`
${tb(["+ -ing","+ to + verb","+ verb without to"],[
["enjoy, avoid, finish, mind, suggest, deny, keep, practise, give up","want, decide, hope, plan, agree, refuse, promise, would like, need","make, let, can, must, should, would rather"],
["look forward to, be used to, despite, after, before, without","purpose: I went out to buy bread.","had better"]])}
<p><b>stop</b>: stop smoking = quit smoking. stop to smoke = stop in order to smoke.</p>
<p><b>need + -ing</b> has a passive meaning: My phone needs charging.</p>`},
{g:"قواعد",t:"Relative clauses",b:`
${tb(["Pronoun","Used for","Example"],[
["who","people","The man who called is my teacher."],
["which","things","The book which I bought is great."],
["whose","possession","The student whose laptop was stolen…"],
["where","places","The city where I was born…"],
["that","people and things (not after a comma)","The film that we saw…"]])}
<p>After a comma, never use \"that\". Use \"which\" or \"who\".</p>`},
{g:"قواعد",t:"Modal verbs",b:`
${tb(["Modal","Meaning"],[
["must / have to","obligation"],["mustn't","prohibition"],["don't have to / needn't","not necessary, you can choose"],
["should","advice"],["should have + V3","criticism of a past action that didn't happen"],
["can't be","impossible (deduction)"],["must be","certainly true (deduction)"],["might / may","possibly"]])}
<p>A modal is always followed by the verb without \"to\": She can't be at home.</p>`},
{g:"قواعد",t:"Comparatives, so/such, too/enough",b:`
${eg("tall → taller → the tallest","interesting → more interesting → the most interesting","good → better → the best | bad → worse → the worst","The more you practise, the better you become.")}
<ul><li>so + adjective: so difficult that…</li>
<li>such a + adjective + noun: such a difficult exam that…</li>
<li>so many + plural countable noun. so much + uncountable noun.</li>
<li>too + adjective (more than needed). adjective + enough: old enough.</li></ul>`},
{g:"قواعد",t:"Reported speech and quantifiers",b:`
<p><b>Reported speech:</b> move the tense one step back, and turn questions into statements (no inversion).</p>
${eg("\"I will come.\" → She said she <b>would</b> come.","\"Where do you live?\" → He asked me where I <b>lived</b>.")}
<p><b>Quantifiers:</b></p>
${tb(["Countable (plural)","Uncountable"],[["many, a few, few","much, a little, little"],["few = almost none (negative)","little = almost none (negative)"],["a few = some (positive)","a little = some, enough (positive)"]])}
<p>\"some\" in positive sentences and offers. \"any\" in negatives and questions.</p>`},
{g:"وظيفية",t:"Functional language phrase bank",b:`
<p>Choose what a native speaker would naturally say, not just a grammatically correct sentence.</p>
${tb(["Situation","Question / statement","Natural reply"],[
["Request","Would you mind opening…?","Not at all. / No, of course not."],
["Permission","Do you mind if I…? / Is it OK if…?","No, go ahead. / Sure."],
["Suggestion","How about…? / Why don't we…? / Let's…","That's a good idea. / Sounds great!"],
["Invitation","Would you like to…?","I'd love to. / I'm afraid I can't."],
["Offer","Shall I…? / Can I help you?","That would be lovely. / I'm just looking."],
["Thanks","Thank you so much.","You're welcome. / Don't mention it."],
["Apology","Sorry I'm late.","That's OK. / Don't worry."],
["Good news","I passed my exam!","Congratulations! / Well done!"],
["Bad news","I failed. / My grandmother died.","What a pity. / I'm sorry to hear that."],
["Illness","I've got a headache.","You should… / Get well soon."],
["Agreeing","I love tea. / I don't like tea.","So do I. / Neither do I."],
["Disagreeing","I think…","I see your point, but… / I'm not sure."],
["Phone","Who's calling?","This is Ali. / Can I take a message?"],
["Not understanding","Sorry, I didn't catch that.","Could you repeat that, please?"]])}
<p><b>Careful:</b> \"What do you do?\" = your job. \"What does he look like?\" = appearance. \"What is he like?\" = personality.</p>`},
{g:"مفردات",t:"Collocations",b:`
${tb(["Verb","Goes with"],[

<p>Other fixed phrases: famous for, interested in, good at, afraid of, depend on, look forward to.</p>`},
{g:"مفردات",t:"Phrasal verbs",b:`
${tb(["Phrasal verb","Meaning"],[

["look for","search for"],["look up","check in a dictionary"],["fill in","complete a form"],["hand in","submit (homework)"],
["turn down","refuse"],["switch off / on","turn off / on"],["bring up","raise a child"],["find out","discover"],
["get on with","have a good relationship with"],["run out of","have none left"],["set off","start a journey"],["go up","increase"]])}`},
{g:"مفردات",t:"Commonly confused words",b:`
${tb(["Words","Difference"],[
["lose / miss","can't find something / fail to catch a bus or attend a class"],
["raise / rise","lift something (with object) / go up by itself (no object)"],
["borrow / lend","take temporarily / give temporarily"],
["fee / fare / fine","charge for a service / price of transport / penalty"],
["cost / price","what you spend / what something is sold for"],
["boring / bored","the thing that causes it / how a person feels"],
["opportunity / occasion","a chance / a special event"],
["adapt / adopt","adjust to / take as your own"],
["suitable / convenient","right for a person or job / fits your time or place"],
["pass / succeed","pass an exam / succeed in something"]])}`},
{g:"قراءة",t:"Reading question types and strategies",b:`
${tb(["Question type","Strategy"],[
["main idea / best title / purpose","Read the first sentence of each paragraph and the last sentence of the text. Reject options that are too narrow or too broad."],
["According to the text…","Find a key word from the question in the text. The answer usually uses different words (synonyms)."],

<p>An option that repeats the exact words of the text is not always correct. Watch out for traps.</p>`}

/* ---------- Learning data (kept on this device) ---------- */
const GOAL=10;
const dayKey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const getStats=()=>{const s=store.get("erx_stats",null)||{};s.sec=s.sec||{};s.rule=s.rule||{};s.day=s.day||{};return s};
function addDay(n){const st=getStats(),d=dayKey();st.day[d]=(st.day[d]||0)+n;store.set("erx_stats",st)}
function recordAnswer(q,ok){
  const st=getStats(); const s=st.sec[q.s]=st.sec[q.s]||{c:0,n:0}; s.n++; if(ok)s.c++;
  if(q.rk){const r=st.rule[q.rk]=st.rule[q.rk]||{c:0,n:0}; r.n++; if(ok)r.c++;}
  const d=dayKey(); st.day[d]=(st.day[d]||0)+1; store.set("erx_stats",st);
  const m=store.get("erx_mist",{});
  if(!ok){const e=m[q.id]||{w:0,r:0}; e.w++; e.r=0; e.t=Date.now(); m[q.id]=e;}
  else if(m[q.id]){m[q.id].r=(m[q.id].r||0)+1; if(m[q.id].r>=2) delete m[q.id];}
  store.set("erx_mist",m);
}
const mistIds=()=>Object.keys(store.get("erx_mist",{})).filter(id=>ITEMS[id]);
const todayCount=()=>getStats().day[dayKey()]||0;
function streak(){const day=getStats().day; let n=0; const d=new Date(); if((day[dayKey(d)]||0)<GOAL) d.setDate(d.getDate()-1); while((day[dayKey(d)]||0)>=GOAL){n++; d.setDate(d.getDate()-1);} return n;}

/* ---------- Vocabulary flashcards (Leitner boxes) ---------- */
const BOX_DAYS=[0,0,1,3,7,14];
const cardsData=()=>store.get("erx_cards",{});
function cardInfo(){const c=cardsData(),now=Date.now(),keys=Object.keys(VOC);
  return {due:keys.filter(k=>c[k]&&c[k].due<=now),fresh:keys.filter(k=>!c[k]),learned:keys.filter(k=>c[k]&&c[k].box>=4).length,total:keys.length};}
let FC=null;
function startCards(){const d=cardInfo(); FC={list:[...shuffle(d.due),...shuffle(d.fresh)].slice(0,20),i:0,flip:false,known:0}; renderCards();}
function gradeCard(ok){const c=cardsData(),k=FC.list[FC.i],e=c[k]||{box:0};
  e.box=ok?Math.min(5,Math.max(1,e.box)+1):1; e.due=Date.now()+BOX_DAYS[e.box]*864e5; c[k]=e; store.set("erx_cards",c);
  if(ok)FC.known++; FC.i++; FC.flip=false; addDay(1); renderCards();}
function renderCards(){
  clearInterval(timerId); applyLang();
  const info=cardInfo(), done=!FC||FC.i>=FC.list.length;
  let body;
  if(done){
    const empty=!FC||!FC.list.length;
    body=`<div class="fcard done"><b>${empty?T("No cards to review right now.","Şu an tekrar edilecek kart yok.","لا توجد بطاقات للمراجعة الآن."):T(`Session finished: you knew ${FC.known} of ${FC.list.length}.`,`Oturum bitti: ${FC.list.length} karttan ${FC.known} tanesini bildin.`,`انتهت الجلسة: عرفت ${FC.known} من ${FC.list.length}.`)}</b>
      <p class="label">${T("Words you didn't know come back soon; words you knew come back after 1, 3, 7 and then 14 days.","Bilmediğin kelimeler yakında tekrar gelir; bildiklerin 1, 3, 7 ve sonra 14 gün sonra gelir.","الكلمات التي لم تعرفها تعود قريباً، والتي عرفتها تعود بعد 1 ثم 3 ثم 7 ثم 14 يوماً.")}</p>
      ${(info.due.length+info.fresh.length)?`<button class="btn primary" id="fcAgain"><span><b>${T("Next 20 cards","Sonraki 20 kart","البطاقات العشرون التالية")}</b></span><span>${FWD()}</span></button>`:""}</div>`;
  } else {
    const k=FC.list[FC.i], v=VOC[k];
    body=`<div class="fctop"><p class="label num">${FC.i+1} / ${FC.list.length}</p>${spk(k)}</div>
    <button class="fcard" id="fcFlip" aria-live="polite"><span class="fword" dir="ltr" lang="en">${esc(k)}</span>
      ${FC.flip?`<span class="fmean">${esc(T(v[0],v[1],v[2]))}</span>${LANG!=="en"?`<span class="label" dir="ltr" lang="en">${esc(v[0])}</span>`:""}`:`<span class="label">${T("Think of the meaning, then tap to check","Anlamını düşün, sonra kontrol etmek için dokun","فكّر في المعنى، ثم اضغط للتحقق")}</span>`}</button>
    ${FC.flip?`<div class="row"><button id="fcNo">${T("I didn't know","Bilmiyordum","لم أعرفها")}</button><button class="go" id="fcYes">${T("I knew it","Biliyordum","عرفتها")}</button></div>`:""}`;
  }
  app.innerHTML=`<div class="bar"><button class="ghost" id="home">${BACK()} ${t("home")}</button><div class="grow"><b>${T("Vocabulary flashcards","Kelime kartları","بطاقات المفردات")}</b><div class="label num">${T(`${info.learned} of ${info.total} words learned`,`${info.total} kelimeden ${info.learned} tanesi öğrenildi`,`تعلّمت ${info.learned} من ${info.total} كلمة`)}</div></div></div>
  <div style="margin-top:14px">${langToggle()}</div><div class="fwrap">${body}</div>`;
  document.getElementById("home").onclick=()=>{renderHome();window.scrollTo(0,0)};
  const f=document.getElementById("fcFlip"); if(f) f.onclick=()=>{FC.flip=!FC.flip;renderCards()};
  const y=document.getElementById("fcYes"); if(y) y.onclick=()=>gradeCard(true);
  const n=document.getElementById("fcNo"); if(n) n.onclick=()=>gradeCard(false);
  const a=document.getElementById("fcAgain"); if(a) a.onclick=startCards;
  bindSpeak();
  bindLang(()=>renderCards());
}

/* ---------- Voice (phone's English text-to-speech) ---------- */
function speak(text,rate){
  rate=rate||store.get("erx_rate",0.95); text=String(text).replace(/_{2,}/g," blank ");
  try{ if(window.AppBridge&&AppBridge.speak){ AppBridge.speak(text,rate); return true; } }catch(e){}
  try{ if(window.speechSynthesis&&window.SpeechSynthesisUtterance){ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=rate;
    const v=speechSynthesis.getVoices().find(v=>/^en[-_](US|GB)/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u); return true; } }catch(e){}
  return false;
}
function stopSpeak(){ try{window.AppBridge&&AppBridge.stopSpeaking&&AppBridge.stopSpeaking()}catch(e){} try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){} }
const voiceAvailable=()=>{ try{ if(window.AppBridge&&AppBridge.canSpeak) return !!AppBridge.canSpeak(); }catch(e){} return !!(window.speechSynthesis&&window.SpeechSynthesisUtterance); };
const spk=(text,cls)=>`<button class="spk ${cls||""}" data-say="${esc(text)}" aria-label="${T("Listen","Dinle","استمع")}" title="${T("Listen","Dinle","استمع")}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none"/></svg></button>`;
function bindSpeak(root){ (root||app).querySelectorAll("[data-say]").forEach(b=>b.onclick=e=>{e.stopPropagation(); if(!speak(b.dataset.say)) toast(T("Voice is not available on this device.","Bu cihazda ses kullanılamıyor.","الصوت غير متاح على هذا الجهاز."));}) }
function toast(msg){ const d=document.createElement("div"); d.className="upd"; d.dir=rtl()?"rtl":"ltr"; d.innerHTML=`<span>${msg}</span>`; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }

/* ---------- Progress page ---------- */
function svgLine(vals){
  const W=600,H=200,L=34,R=12,Tp=12,B=26,n=vals.length,x=i=>L+(n<2?(W-L-R)/2:i*(W-L-R)/(n-1)),y=v=>Tp+(100-v)/100*(H-Tp-B);
  const pts=vals.map((v,i)=>x(i)+","+y(v)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${T("Exam scores over time","Zaman içindeki sınav puanları","درجات الامتحانات عبر الوقت")}">
    ${[0,55,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="${v===55?"passln":"grid"}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="ax">${v}</text>`).join("")}
    <polyline points="${pts}" class="ln"/>
    ${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===n-1?6:4}" class="${v>=55?"dotp":"dotf"}"/>`).join("")}
    <text x="${x(n-1)}" y="${y(vals[n-1])-12}" text-anchor="middle" class="lastv">${vals[n-1]}</text>
    <text x="${W-R}" y="${y(55)-6}" text-anchor="end" class="ax">${T("pass 55","geçme 55","النجاح 55")}</text></svg>`;
}
function svgDays(){
  const day=getStats().day, ds=[]; for(let i=13;i>=0;i--){const d=new Date(); d.setDate(d.getDate()-i); ds.push([d,day[dayKey(d)]||0]);}
  const W=600,H=150,B=22,Tp=10,max=Math.max(GOAL,...ds.map(x=>x[1])),bw=(W-20)/14,y=v=>Tp+(1-v/max)*(H-Tp-B);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${T("Questions answered per day","Günlük cevaplanan soru","الأسئلة المجابة يومياً")}">
    <line x1="10" x2="${W-10}" y1="${y(GOAL)}" y2="${y(GOAL)}" class="passln"/>
    ${ds.map(([d,v],i)=>`<rect x="${10+i*bw+4}" y="${y(v)}" width="${bw-8}" height="${Math.max(0,H-B-y(v))}" rx="3" class="${v>=GOAL?"dbarok":"dbar"}"/><text x="${10+i*bw+bw/2}" y="${H-6}" text-anchor="middle" class="ax">${d.getDate()}</text>`).join("")}</svg>`;
}
function renderProgress(){
  clearInterval(timerId); applyLang();
  const st=getStats(), hist=store.get("erx_hist",[]).filter(h=>h.k!==undefined||h.t), scores=hist.slice(-15).map(h=>h.s);
  const tot=Object.values(st.sec).reduce((a,s)=>({c:a.c+s.c,n:a.n+s.n}),{c:0,n:0});
  const weak=Object.entries(st.rule).filter(([k,v])=>RULES[k]&&v.n>=2).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).slice(0,5);
  const pct=v=>Math.round(v.c/v.n*100);
  app.innerHTML=`<div class="bar"><button class="ghost" id="home">${BACK()} ${t("home")}</button><div class="grow"><b>${T("My progress","İlerlemem","تقدّمي")}</b></div></div>
  <div style="margin-top:14px">${langToggle()}</div>
  <div class="facts">
    <div><b>${streak()}</b><span>${T("day streak","günlük seri","أيام متتالية")}</span></div>
    <div><b>${tot.n}</b><span>${T("questions answered","cevaplanan soru","سؤال أجبت عليه")}</span></div>
    <div><b>${tot.n?Math.round(tot.c/tot.n*100)+"%":"–"}</b><span>${T("correct","doğru","صحيحة")}</span></div>
    <div><b>${mistIds().length}</b><span>${T("in mistakes notebook","yanlış defterinde","في دفتر الأخطاء")}</span></div>
  </div>
  <section><h2>${T("Exam scores","Sınav puanları","درجات الامتحانات")}</h2>
    ${scores.length?svgLine(scores):`<p class="label">${T("Finish a full exam to see your scores here.","Puanlarını burada görmek için bir deneme sınavı bitir.","أنهِ امتحاناً كاملاً لترى درجاتك هنا.")}</p>`}</section>
  <section><h2>${T("Accuracy by section","Bölümlere göre doğruluk","الدقة حسب القسم")}</h2>
    ${["g","f","v","r"].map(s=>{const v=st.sec[s];return `<div class="sbar"><span>${secName(s)}</span><span class="tr"><i style="width:${v?pct(v):0}%"></i></span><span class="num">${v?pct(v)+"%":"–"}</span></div>`}).join("")}</section>
  <section><h2>${T("Grammar rules to review","Tekrar etmen gereken kurallar","قواعد تحتاج مراجعتها")}</h2>
    ${weak.length?weak.map(([k,v])=>`<div class="secrow"><span class="tag">${pct(v)}%</span><span>${esc(T(...RULES[k].t))}</span><span class="label num">${v.c}/${v.n}</span></div>`).join("")+`<button class="btn" id="toGrammar" style="margin-top:10px"><span><b>${t("hGrammar")}</b></span><span>${FWD()}</span></button>`:`<p class="label">${T("Answer more grammar questions to see your weakest rules.","En zayıf kurallarını görmek için daha fazla dil bilgisi sorusu cevapla.","أجب عن مزيد من أسئلة القواعد لترى أضعف القواعد عندك.")}</p>`}</section>
  <section><h2>${T("Last 14 days","Son 14 gün","آخر 14 يوماً")}</h2><p class="label">${T(`The line is your daily goal (${GOAL} questions).`,`Çizgi günlük hedefin (${GOAL} soru).`,`الخط هو هدفك اليومي (${GOAL} أسئلة).`)}</p>${svgDays()}</section>`;
  document.getElementById("home").onclick=()=>{renderHome();window.scrollTo(0,0)};
  const g=document.getElementById("toGrammar"); if(g) g.onclick=()=>renderGrammar();
  bindLang(()=>renderProgress());
  window.scrollTo(0,0);
}

const WTIPS={
 toefl_email:["Structure: greeting → why you are writing → details (answer every bullet point) → a polite request → closing. Use a polite, semi-formal tone. Aim for 80–120 words in about 7 minutes.","Yapı: selamlama → neden yazdığın → ayrıntılar (her maddeye cevap ver) → kibar bir rica → kapanış. Kibar, yarı resmî bir dil kullan. Yaklaşık 7 dakikada 80–120 kelime hedefle.","البنية: التحية ← سبب الكتابة ← التفاصيل (أجب عن كل نقطة) ← طلب مهذب ← الختام. استخدم لغة مهذبة شبه رسمية، واستهدف 80–120 كلمة في حوالي 7 دقائق."],
 toefl_disc:["Give your opinion in the first sentence, mention a classmate's idea (I understand Maria's point, but…), then support your view with a reason and an example. 100+ words in 10 minutes.","İlk cümlede görüşünü söyle, bir arkadaşının fikrine değin (I understand Maria's point, but…), sonra görüşünü bir sebep ve bir örnekle destekle. 10 dakikada 100+ kelime.","اذكر رأيك في الجملة الأولى، وأشر إلى فكرة أحد الزملاء (I understand Maria's point, but…)، ثم ادعم رأيك بسبب ومثال. أكثر من 100 كلمة في 10 دقائق."],
 ielts_t1:["Paragraph 1: paraphrase the question. Paragraph 2: an overview of the main trends (no numbers). Paragraphs 3–4: key details with numbers and comparisons. Don't give your opinion. 150+ words in 20 minutes.","1. paragraf: soruyu başka kelimelerle yaz. 2. paragraf: ana eğilimlerin genel özeti (sayı yok). 3–4. paragraflar: sayılar ve karşılaştırmalarla önemli ayrıntılar. Görüş bildirme. 20 dakikada 150+ kelime.","الفقرة 1: أعد صياغة السؤال. الفقرة 2: نظرة عامة على أهم الاتجاهات (بدون أرقام). الفقرتان 3–4: التفاصيل المهمة مع الأرقام والمقارنات. لا تذكر رأيك. أكثر من 150 كلمة في 20 دقيقة."],
 ielts_t2:["Introduction (paraphrase + your position) → body 1 (first view + example) → body 2 (second view + example) → conclusion (your opinion). Use linkers: On the one hand, However, For example, In conclusion. 250+ words in 40 minutes.","Giriş (soruyu yeniden yaz + görüşün) → gelişme 1 (birinci görüş + örnek) → gelişme 2 (ikinci görüş + örnek) → sonuç (kendi görüşün). Bağlaçlar kullan: On the one hand, However, For example, In conclusion. 40 dakikada 250+ kelime.","المقدمة (إعادة صياغة + موقفك) ← الفقرة 1 (الرأي الأول + مثال) ← الفقرة 2 (الرأي الثاني + مثال) ← الخاتمة (رأيك). استخدم أدوات الربط: On the one hand, However, For example, In conclusion. أكثر من 250 كلمة في 40 دقيقة."]

let TEST_CUR="toefl";
function tbar(title,back){ return `<div class="bar"><button class="ghost" id="home">${BACK()} ${back}</button><div class="grow"><b>${title}</b></div></div><div style="margin-top:14px">${langToggle()}</div>`; }
function renderTests(){
  clearInterval(timerId); stopSpeak(); applyLang();
  app.innerHTML=`${tbar("TOEFL & IELTS",t("home"))}
  <p class="label">${T("Extra practice for international English tests, in the same style as the real tasks. The questions are written for practice and are not official test material.","Uluslararası İngilizce sınavları için gerçek görevlere benzer ek alıştırmalar. Sorular alıştırma için yazılmıştır, resmî sınav materyali değildir.","تدريب إضافي لامتحانات الإنجليزية الدولية بنفس أسلوب المهام الحقيقية. الأسئلة مكتوبة للتدريب وليست من مواد الامتحان الرسمية.")}</p>
  <div class="stack">
    <button class="btn tbtn" data-test="toefl"><span><b>TOEFL iBT</b><small>${T("2026 format · Reading, Listening, Writing, Speaking","2026 formatı · Okuma, Dinleme, Yazma, Konuşma","شكل 2026 · قراءة، استماع، كتابة، محادثة")}</small></span><span>${FWD()}</span></button>
    <button class="btn tbtn" data-test="ielts"><span><b>IELTS Academic</b><small>${T("Band 0–9 · Reading, Listening, Writing, Speaking","Band 0–9 · Okuma, Dinleme, Yazma, Konuşma","درجات 0–9 · قراءة، استماع، كتابة، محادثة")}</small></span><span>${FWD()}</span></button>
  </div>`;
  document.getElementById("home").onclick=()=>{renderHome();window.scrollTo(0,0)};
  app.querySelectorAll("[data-test]").forEach(b=>b.onclick=()=>renderTestHome(b.dataset.test));
  bindLang(()=>renderTests()); window.scrollTo(0,0);

function renderTestHome(x){
  TEST_CUR=x; clearInterval(timerId); stopSpeak(); applyLang();
  const name=x==="toefl"?"TOEFL iBT":"IELTS Academic";
  app.innerHTML=`${tbar(name,"TOEFL & IELTS")}
  <details class="lesson" open><summary>${T("About the test","Sınav hakkında","عن الامتحان")}<span class="label">＋</span></summary><div class="lb">${T(...OVERVIEW[x])}</div></details>
  <section><h2>${T("Practise","Alıştırma yap","تدرّب")}</h2><div class="stack">
  ${TESTMENU[x].map(([kind,key,lab])=>{const n=kind==="r"?TESTSETS[key]().length:0;
    return `<button class="btn" data-k="${kind}" data-key="${key}"><span><b>${T(...lab)}</b><small>${kind==="r"?qCount(n):kind==="w"?T("Timer, word count and model answer","Zamanlayıcı, kelime sayacı ve örnek cevap","مؤقّت وعدّاد كلمات ونموذج إجابة"):T("Questions read aloud, with timers","Sesli sorular ve zamanlayıcı","أسئلة مسموعة مع مؤقّت")}</small></span><span>${FWD()}</span></button>`}).join("")}
  </div></section>`;
  document.getElementById("home").onclick=()=>renderTests();
  app.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>{const k=b.dataset.key; if(b.dataset.k==="r") start("practice",k); else if(b.dataset.k==="w") renderWriting(k); else renderSpeaking(k);});
  bindLang(()=>renderTestHome(x)); window.scrollTo(0,0);
}
function ieltsChart(){
  const data=[["Asia",12,18],["Europe",8,10],["Africa",3,6],["S. America",2,3]], W=560,H=260,L=40,B=40,Tp=16,max=20,y=v=>Tp+(1-v/max)*(H-Tp-B),gw=(W-L-10)/4;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="International students by region, 2015 and 2025">
   ${[0,5,10,15,20].map(v=>`<line x1="${L}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="ax">${v}</text>`).join("")}
   ${data.map(([n,a,b],i)=>{const x0=L+i*gw+gw*0.15,bw=gw*0.32;return `<rect x="${x0}" y="${y(a)}" width="${bw}" height="${H-B-y(a)}" class="dbar"/><rect x="${x0+bw+4}" y="${y(b)}" width="${bw}" height="${H-B-y(b)}" class="dbarok"/><text x="${x0+bw+2}" y="${H-B+16}" text-anchor="middle" class="ax">${n}</text>`}).join("")}
   <rect x="${W-160}" y="${Tp}" width="12" height="12" class="dbar"/><text x="${W-142}" y="${Tp+10}" class="ax">2015</text><rect x="${W-95}" y="${Tp}" width="12" height="12" class="dbarok"/><text x="${W-77}" y="${Tp+10}" class="ax">2025</text>
   <text x="${L}" y="${H-6}" class="ax">thousands of students</text></svg>`;
}
function renderWriting(k){
  clearInterval(timerId); stopSpeak(); applyLang();
  const w=WTASKS[k], key="erx_w_"+k, saved=store.get(key,"");
  app.innerHTML=`${tbar(w.title,TEST_CUR==="toefl"?"TOEFL iBT":"IELTS")}
  <section><div class="passage en" lang="en" style="white-space:pre-line;max-height:none">${esc(w.prompt)}</div>${w.chart?ieltsChart():""}</section>
  <p class="note">${T(...WTIPS[k])}</p>
  <div class="wtools"><button class="go" id="wStart">⏱ ${T(`Start ${w.min}-minute timer`,`${w.min} dakikalık zamanlayıcıyı başlat`,`ابدأ مؤقّت ${w.min} دقيقة`)}</button><span class="t num" id="wt">${String(w.min).padStart(2,"0")}:00</span></div>
  <textarea id="wText" class="wbox" dir="ltr" lang="en" rows="12" placeholder="${T("Write your answer here…","Cevabını buraya yaz…","اكتب إجابتك هنا…")}">${esc(saved)}</textarea>
  <p class="label num" id="wc"></p>
  <details class="lesson"><summary>${T("Show model answer","Örnek cevabı göster","إظهار نموذج الإجابة")}<span class="label">＋</span></summary><div class="lb"><div class="eg" dir="ltr" lang="en" style="white-space:pre-line">${esc(w.model)}</div><p class="label">${T(`Words: ${w.model.split(/\s+/).length}`,`Kelime: ${w.model.split(/\s+/).length}`,`عدد الكلمات: ${w.model.split(/\s+/).length}`)}</p></div></details>`;
  const ta=document.getElementById("wText"), wc=document.getElementById("wc");
  const count=()=>{const n=(ta.value.trim().match(/\S+/g)||[]).length; wc.textContent=T(`${n} words (target ${w.words})`,`${n} kelime (hedef ${w.words})`,`${n} كلمة (الهدف ${w.words})`); store.set(key,ta.value);};
  ta.oninput=count; count();
  document.getElementById("wStart").onclick=()=>{ clearInterval(timerId); const end=Date.now()+w.min*60000, el=document.getElementById("wt");
    timerId=setInterval(()=>{const left=end-Date.now(); if(!document.getElementById("wt")){clearInterval(timerId);return} el.textContent=fmt(left); el.classList.toggle("low",left<60000); if(left<=0){clearInterval(timerId); el.textContent=T("Time's up","Süre doldu","انتهى الوقت");}},500); };
  document.getElementById("home").onclick=()=>renderTestHome(TEST_CUR);
  bindLang(()=>renderWriting(k)); window.scrollTo(0,0);
}
let SP={k:null,i:0};
function renderSpeaking(k,i){
  clearInterval(timerId); stopSpeak(); applyLang();
  const s=STASKS[k]; SP={k,i:i||0};
  let body;
  if(s.type==="repeat"){
    body=`<p class="note">${T(...STIPS.repeat)}</p>${s.items.map((x,j)=>`<div class="srow"><button class="go" data-play="${j}">▶ ${T("Listen","Dinle","استمع")} ${j+1}</button><details><summary class="label">${T("Show text","Metni göster","إظهار النص")}</summary><span dir="ltr" lang="en">${esc(x)}</span></details></div>`).join("")}`;
  } else {
    const q=s.items[SP.i];
    body=`<p class="note">${T(...STIPS.timed)}</p>
    <p class="label num">${T("Question","Soru","السؤال")} ${SP.i+1} / ${s.items.length}</p>
    <div class="passage en" lang="en" style="white-space:pre-line;max-height:none">${esc(q)}</div>
    <div class="wtools"><button id="sListen">🔊 ${T("Listen to the question","Soruyu dinle","استمع للسؤال")}</button><button class="go" id="sStart">⏱ ${s.prep?T(`Prepare ${s.prep}s, then speak ${s.speak}s`,`${s.prep} sn hazırlan, sonra ${s.speak} sn konuş`,`تحضير ${s.prep} ثانية ثم كلام ${s.speak} ثانية`):T(`Speak for ${s.speak}s`,`${s.speak} sn konuş`,`تكلّم ${s.speak} ثانية`)}</button></div>
    <div class="sphase" id="sPhase"></div>
    <div class="row"><button id="sPrev" ${SP.i===0?"disabled":""}>${BACK()} ${t("prev")}</button><button class="go" id="sNext" ${SP.i===s.items.length-1?"disabled":""}>${t("next")} ${FWD()}</button></div>`;
  }
  app.innerHTML=`${tbar(s.title,TEST_CUR==="toefl"?"TOEFL iBT":"IELTS")}${body}`;
  document.getElementById("home").onclick=()=>renderTestHome(TEST_CUR);
  app.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{ if(!speak(s.items[+b.dataset.play],store.get("erx_rate",0.95)*0.9)) toast(T("Voice is not available on this device.","Bu cihazda ses kullanılamıyor.","الصوت غير متاح على هذا الجهاز.")); });
  const L=document.getElementById("sListen"); if(L) L.onclick=()=>speak(s.items[SP.i].replace(/\n?You should say:[\s\S]*/,""));
  const P2=document.getElementById("sPrev"); if(P2) P2.onclick=()=>renderSpeaking(k,SP.i-1);
  const N=document.getElementById("sNext"); if(N) N.onclick=()=>renderSpeaking(k,SP.i+1);
  const St=document.getElementById("sStart"); if(St) St.onclick=()=>{
    clearInterval(timerId); const ph=document.getElementById("sPhase"); let phase=s.prep?"prep":"speak"; let end=Date.now()+(s.prep||s.speak)*1000;
    const draw=()=>{ if(!document.getElementById("sPhase")){clearInterval(timerId);return}
      const left=end-Date.now();
      if(left<=0){ if(phase==="prep"){phase="speak"; end=Date.now()+s.speak*1000; return;} clearInterval(timerId); ph.className="sphase done"; ph.textContent=T("Time's up. Well done!","Süre doldu. Aferin!","انتهى الوقت. أحسنت!"); return; }
      ph.className="sphase "+phase; ph.innerHTML=`<b>${phase==="prep"?T("Prepare","Hazırlan","حضّر"):T("Speak now","Şimdi konuş","تكلّم الآن")}</b><span class="num">${Math.ceil(left/1000)}s</span>`; };
    draw(); timerId=setInterval(draw,250); };
  bindLang(()=>renderSpeaking(k,SP.i)); window.scrollTo(0,0);
}

/* ---------- Quiz ---------- */
function fmt(ms){ms=Math.max(0,ms);const s0=Math.floor(ms/1000);const h=Math.floor(s0/3600),m=Math.floor(s0%3600/60),s=s0%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function tick(){
  const el=document.getElementById("tm"); if(!el||!S||!S.end) return;
  const left=S.end-Date.now(); el.textContent=fmt(left); el.classList.toggle("low",left<10*60*1000);
  if(left<=0) finish();
}
function renderQuiz(){
  clearInterval(timerId); applyLang();
  const it=S.items[S.cur], q=ITEMS[it.id];
  const answered=Object.keys(S.ans).length, total=S.items.length;
  const chosen=S.ans[S.cur], practice=S.mode==="practice", locked=practice&&chosen!==undefined;
  const pass = q.p!==undefined ? P[q.p] : null;
  app.innerHTML=`
  <div class="bar">
    <button class="ghost" id="home" aria-label="${t("home")}">✕</button>
    <div class="grow"><div class="label">${esc(titleOf(S))} · <span class="num">${answered}/${total}</span></div><div class="prog"><i style="width:${answered/total*100}%"></i></div></div>
    ${S.end?`<span class="t" id="tm">${fmt(S.end-Date.now())}</span>`:""}
    <button class="ghost" id="map">${t("sheet")}</button>
  </div>
  ${S.kind>100?`<div class="b2tag">${t("b2Badge")}</div>`:""}
  <div class="secname"><span><b>${secName(q.s)}</b> <span class="label">${secSub(q.s)}</span></span><span class="qtools"><span class="qnum">Question ${S.cur+1} / ${total}</span><button class="star ${isFav(q.id)?"on":""}" id="favQ" aria-pressed="${isFav(q.id)}" aria-label="${T("Save to favourites","Favorilere kaydet","حفظ في المفضّلة")}" title="${T("Save to favourites","Favorilere kaydet","حفظ في المفضّلة")}">${isFav(q.id)?"★":"☆"}</button></span></div>
  ${pass&&pass.audio?`<div class="audio">
      <div class="audrow"><button class="go" id="aPlay">▶ ${T("Play the recording","Kaydı dinle","تشغيل التسجيل")}</button><button id="aStop">■ ${T("Stop","Durdur","إيقاف")}</button></div>
      <p class="label">${esc(pass.t)} · ${T("Listen first, then answer. You can play it again.","Önce dinle, sonra cevapla. Tekrar dinleyebilirsin.","استمع أولاً ثم أجب. يمكنك إعادة التشغيل.")}</p>
      <details><summary class="label">${T("Show transcript","Metni göster","إظهار النص")}</summary><div class="passage en" lang="en">${pass.x.map(p=>`<p>${esc(p)}</p>`).join("")}</div></details></div>`
   :pass?`<div class="passage en" lang="en"><h3>${esc(pass.t)} ${spk(pass.x.join(" "))}</h3>${pass.x.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`:""}
  <div class="qcard">
    <div class="qtext en" lang="en">${esc(q.q)} ${q.s!=="l"?spk(q.q.replace(/^[AB]: /gm,"")):""}</div>
    <div class="opts" lang="en">
      ${it.perm.map((oi,k)=>{
        let c=""; if(locked){ if(oi===0)c="right"; else if(oi===chosen)c="wrong"; } else if(oi===chosen)c="sel";
        return `<button class="opt ${c}" data-oi="${oi}" ${locked?"disabled":""}><span class="bub">${L[k]}</span><span>${esc(q.o[oi])}</span></button>`}).join("")}
    </div>
    ${locked?`<div class="explain ${chosen===0?"":"no"}"><b>${chosen===0?t("correct"):t("wrong")}</b><br>${esc(exText(q))}</div>`:""}
  </div>
  <nav class="nav"><div class="in">
    <button id="prev" ${S.cur===0?"disabled":""}>${BACK()} ${t("prev")}</button>
    ${practice?"":`<button id="flag" class="flag ${S.flags[S.cur]?"on":""}">${S.flags[S.cur]?t("flagged"):t("flag")}</button>`}
    ${S.cur===total-1?`<button class="go" id="fin">${t("finish")}</button>`:`<button class="go" id="next">${t("next")} ${FWD()}</button>`}
  </div></nav>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(locked) return; S.ans[S.cur]=+b.dataset.oi; if(practice) recordAnswer(q,+b.dataset.oi===0); save(); renderQuiz(); });
  document.getElementById("home").onclick=()=>{save();renderHome();window.scrollTo(0,0)};
  document.getElementById("map").onclick=openMap;
  document.getElementById("favQ").onclick=()=>{toggleFav(q.id);renderQuiz()};
  bindSpeak();
  const ap=document.getElementById("aPlay"); if(ap) ap.onclick=()=>{ if(!speak(pass.x.join(" "),store.get("erx_rate",0.95)*0.95)) toast(T("Voice is not available on this device. Open the transcript instead.","Bu cihazda ses yok. Bunun yerine metni aç.","الصوت غير متاح على هذا الجهاز. افتح النص بدلاً من ذلك.")) };
  const as=document.getElementById("aStop"); if(as) as.onclick=stopSpeak;
  const go=d=>{stopSpeak();S.cur+=d;save();renderQuiz();window.scrollTo(0,pass&&ITEMS[S.items[S.cur].id].p===q.p?window.scrollY:0)};
  const pv=document.getElementById("prev"); pv.onclick=()=>S.cur>0&&go(-1);
  const nx=document.getElementById("next"); if(nx) nx.onclick=()=>go(1);
  const fl=document.getElementById("flag"); if(fl) fl.onclick=()=>{S.flags[S.cur]=!S.flags[S.cur];save();renderQuiz()};
  const fn=document.getElementById("fin"); if(fn) fn.onclick=confirmFinish;
  if(S.end){timerId=setInterval(tick,1000);tick()}
}
function sheetEl(cls){ const d=document.createElement("div"); d.className=cls; d.dir=rtl()?"rtl":"ltr"; d.lang=LANG; return d; }
function openMap(){
  const d=sheetEl("sheet");
  let html=`<div class="pan"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:18px">${t("sheet")}</h2><button class="ghost" id="cls">${t("close")}</button></div>
  <div class="legend" style="margin-top:8px"><span>● ${t("lgAns")}</span><span>○ ${t("lgNo")}</span><span style="color:var(--warn)">● ${t("lgFlag")}</span></div>`;
  let last=null;
  S.items.forEach((it,i)=>{const s=ITEMS[it.id].s; if(s!==last){ if(last!==null) html+=`</div>`; html+=`<div class="omap-sec">${secName(s)}</div><div class="omap">`; last=s;}
    html+=`<button data-i="${i}" class="${S.ans[i]!==undefined?"a":""} ${S.flags[i]?"f":""} ${i===S.cur?"cur":""}">${i+1}</button>`});
  html+=`</div><div class="row"><button class="go" id="fin2">${t("finishGrade")}</button></div></div>`;
  d.innerHTML=html;document.body.appendChild(d);
  d.onclick=e=>{ if(e.target===d||e.target.id==="cls") d.remove(); const i=e.target.dataset&&e.target.dataset.i; if(i!==undefined){S.cur=+i;save();d.remove();renderQuiz();window.scrollTo(0,0)} if(e.target.id==="fin2"){d.remove();confirmFinish()} };
}
function confirmFinish(){
  const left=S.items.length-Object.keys(S.ans).length;
  const d=sheetEl("sheet dlg");
  d.innerHTML=`<div class="pan"><h2 style="font-size:18px">${t("confirmT")}</h2>
  <p>${left?T(`You still have <b class="num">${left}</b> unanswered questions. Wrong answers don't lose points, so it's better to answer every question.`,`Hâlâ <b class="num">${left}</b> boş sorun var. Yanlış cevaplar puan götürmez, bu yüzden tüm soruları cevaplamak daha iyi.`,`ما زال عندك <b class="num">${left}</b> سؤال بدون إجابة. تذكّر أن الإجابة الخاطئة لا تُنقص من درجتك، لذلك من الأفضل أن تجيب على كل الأسئلة.`):t("allDone")}</p>
  <div class="row"><button id="no">${t("goBack")}</button><button class="go" id="yes">${t("gradeNow")}</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector("#no").onclick=()=>d.remove(); d.querySelector("#yes").onclick=()=>{d.remove();finish()};
}
function finish(){
  clearInterval(timerId); document.querySelectorAll(".sheet").forEach(x=>x.remove());
  S.done=true; store.del("erx_cur");
  const correct=S.items.filter((it,i)=>S.ans[i]===0).length;
  const score=Math.round(correct/S.items.length*100);
  if(S.mode==="exam") S.items.forEach((it,i)=>recordAnswer(ITEMS[it.id],S.ans[i]===0));
  if(S.mode==="exam"){const h=store.get("erx_hist",[]);h.push({k:S.kind,t:titleOf(S),s:score,ts:Date.now()});store.set("erx_hist",h.slice(-30))}
  reviewFilter="wrong"; renderResult(); window.scrollTo(0,0);
}

/* ---------- Result ---------- */
function renderResult(){
  applyLang();
  const n=S.items.length, correct=S.items.filter((it,i)=>S.ans[i]===0).length, score=Math.round(correct/n*100), ok=score>=55;
  const by={}; S.items.forEach((it,i)=>{const s=ITEMS[it.id].s;by[s]=by[s]||{c:0,n:0};by[s].n++; if(S.ans[i]===0)by[s].c++});
  const blank=n-Object.keys(S.ans).length, wrongN=n-correct-blank;
  const list=S.items.map((it,i)=>({it,i,q:ITEMS[it.id],a:S.ans[i]})).filter(x=>reviewFilter==="all"||x.a!==0);
  const weakest=Object.entries(by).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n)[0];
  app.innerHTML=`
  <div class="score">
    <span class="label">${esc(titleOf(S))}</span>
    <div class="big">${score}<small>/100</small></div>
    <span class="verdict ${ok?"pass":"fail"}">${ok?t("passV"):t("failV")}</span>
    ${S.kind>100?`<span class="b2tag">${t("b2Badge")}</span><span class="label" style="max-width:34em">${t("b2Result")}</span>`:""}
    <span class="label num">${T(`${correct} correct · ${wrongN} wrong · ${blank} blank`,`${correct} doğru · ${wrongN} yanlış · ${blank} boş`,`${correct} صحيحة · ${wrongN} خاطئة · ${blank} بدون إجابة`)}</span>
  </div>
  <div style="margin-top:14px">${langToggle()}</div>
  <section>
    <h2>${t("hBySec")}</h2>
    ${Object.entries(by).map(([s,v])=>`<div class="sbar"><span>${secName(s)}</span><span class="tr"><i style="width:${v.c/v.n*100}%"></i></span><span class="num">${v.c}/${v.n}</span></div>`).join("")}
    ${Object.keys(by).length>1?`<p class="label">${T(`Your weakest section: <b>${secName(weakest[0])}</b>. Practise it from the home page.`,`En zayıf bölümün: <b>${secName(weakest[0])}</b>. Ana sayfadan bu bölümü çalış.`,`أضعف قسم عندك: <b>${secName(weakest[0])}</b>. جرّب التدريب عليه من الصفحة الرئيسية.`)}</p>`:""}
  </section>
  <div class="stack" style="margin-top:18px">
    <button class="btn primary" id="again"><span><b>${t("againT")}</b><small>${t("againSub")}</small></span><span>${FWD()}</span></button>
    <button class="btn" id="toLessons"><span><b>${t("toLessonsT")}</b><small>${t("toLessonsSub")}</small></span><span>${FWD()}</span></button>
  </div>
  <section>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2>${t("hReview")}</h2>
    <div class="chips"><button data-f="wrong" class="${reviewFilter==="wrong"?"on":""}">${t("onlyWrong")}</button><button data-f="all" class="${reviewFilter==="all"?"on":""}">${t("allQ")}</button></div></div>
    ${list.length?list.map(x=>`<div class="rv">
      <span class="qnum">Q${x.i+1} · ${secName(x.q.s)}${x.q.p!==undefined?` · ${esc(P[x.q.p].t)}`:""}</span>
      <div class="qtext en" lang="en">${esc(x.q.q)}</div>
      ${x.a===0?`<div class="a c">✓ ${esc(x.q.o[0])}</div>`:`<div class="a y">✗ ${x.a===undefined?t("noAns"):esc(x.q.o[x.a])}</div><div class="a c">✓ ${esc(x.q.o[0])}</div>`}
      <div class="ex">${esc(exText(x.q))}</div></div>`).join(""):`<p>${t("noMistakes")}</p>`}
  </section>`;
  document.getElementById("again").onclick=()=>{renderHome();window.scrollTo(0,0)};
  document.getElementById("toLessons").onclick=()=>renderLessons();
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{reviewFilter=b.dataset.f;renderResult()});
  bindLang(()=>renderResult());
}

/* Online updates (used by the APK wrapper). Raise APP_VERSION every time you upload a new version. */
const APP_VERSION = 11;
function banner(msg,btn,fn){
  document.querySelectorAll(".upd").forEach(x=>x.remove());
  const d=document.createElement("div");d.className="upd";d.setAttribute("role","status");d.dir=rtl()?"rtl":"ltr";
  d.innerHTML=`<span>${msg}</span><button class="go">${btn}</button><button class="x" aria-label="${t("close")}">✕</button>`;
  d.querySelector(".go").onclick=fn; d.querySelector(".x").onclick=()=>d.remove();
  document.body.appendChild(d);
}
window.appUpdateReady=function(){ banner(t("updReady"),t("updNow"),()=>{save();window.AppBridge&&AppBridge.reload()}) };
window.appApkUpdate=function(url){ banner(t("apkNew"),t("download"),()=>window.AppBridge&&AppBridge.open(url)) };

/* Android back button support (used by the APK wrapper) */
window.appBack=function(){
  const sh=document.querySelector(".sheet"); if(sh){sh.remove();return true}
  const b=document.getElementById("home")||document.getElementById("again"); if(b){b.click();return true}
  return false;
};
applyZoom();
renderHome();
setInterval(()=>{const c=document.getElementById("cd");if(c)c.innerHTML=countdown()},30000);
</script>

</html>
